<line x1="724.0" y1="73.0" x2="748.0" y2="73.0" stroke="#C00000" stroke-width="2.4" marker-end="url(#arrPrb)"/>
<text x="86.0" y="66.0" text-anchor="middle" font-size="19" fill="#222222" font-weight="bold" font-style="normal"><tspan>inputs x</tspan><tspan baseline-shift="sub" font-size="13.7">i</tspan><tspan>, x</tspan><tspan baseline-shift="sub" font-size="13.7">j</tspan></text>
<text x="86.0" y="94.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="normal" font-style="normal">pre-norm bounded</text>
<text x="275.0" y="66.0" text-anchor="middle" font-size="19" fill="#C00000" font-weight="bold" font-style="normal"><tspan>W</tspan><tspan baseline-shift="sub" font-size="13.7">q</tspan><tspan>, W</tspan><tspan baseline-shift="sub" font-size="13.7">k</tspan></text>
<text x="275.0" y="94.0" text-anchor="middle" font-size="17" fill="#C00000" font-weight="normal" font-style="normal">norms unbounded</text>
<text x="476.0" y="66.0" text-anchor="middle" font-size="19" fill="#C00000" font-weight="bold" font-style="normal"><tspan>logit q</tspan><tspan baseline-shift="sub" font-size="13.7">i</tspan><tspan> · k</tspan><tspan baseline-shift="sub" font-size="13.7">j</tspan><tspan> / √d</tspan></text>
<text x="476.0" y="94.0" text-anchor="middle" font-size="17" fill="#C00000" font-weight="normal" font-style="normal">grows with the weights</text>
<text x="662.0" y="66.0" text-anchor="middle" font-size="19" fill="#C00000" font-weight="bold" font-style="normal">softmax</text>
<text x="662.0" y="94.0" text-anchor="middle" font-size="17" fill="#C00000" font-weight="normal" font-style="normal">near one-hot</text>
<text x="808.0" y="66.0" text-anchor="middle" font-size="19" fill="#C00000" font-weight="bold" font-style="normal">loss spikes</text>
<text x="808.0" y="94.0" text-anchor="middle" font-size="17" fill="#C00000" font-weight="normal" font-style="normal">divergence</text>
<text x="275.0" y="142.0" text-anchor="middle" font-size="17" fill="#C00000" font-weight="normal" font-style="italic">Muon: full-rank updates</text>
<text x="662.0" y="142.0" text-anchor="middle" font-size="17" fill="#C00000" font-weight="normal" font-style="italic">entropy collapse</text>
<rect x="150.0" y="166.0" width="570.0" height="64.0" rx="6" fill="#FFFFFF" stroke="#595959" stroke-width="1.6" />
<text x="435.0" y="208.0" text-anchor="middle" font-size="26" fill="#222222" font-weight="normal" font-style="normal"><tspan>|q</tspan><tspan baseline-shift="sub" font-size="18.7">i</tspan><tspan> · k</tspan><tspan baseline-shift="sub" font-size="18.7">j</tspan><tspan>|  ≤  </tspan><tspan fill="#7F7F7F">‖x</tspan><tspan fill="#7F7F7F" baseline-shift="sub" font-size="18.7">i</tspan><tspan fill="#7F7F7F">‖ ‖x</tspan><tspan fill="#7F7F7F" baseline-shift="sub" font-size="18.7">j</tspan><tspan fill="#7F7F7F">‖</tspan><tspan fill="#C00000" font-weight="bold">  ‖W</tspan><tspan fill="#C00000" font-weight="bold" baseline-shift="sub" font-size="18.7">q</tspan><tspan fill="#C00000" font-weight="bold">‖ ‖W</tspan><tspan fill="#C00000" font-weight="bold" baseline-shift="sub" font-size="18.7">k</tspan><tspan fill="#C00000" font-weight="bold">‖</tspan></text>
</svg>

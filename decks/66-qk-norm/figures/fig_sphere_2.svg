<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="280pt" viewBox="0 0 870 280" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchAcc" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#DEEBF7"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1F4E79" stroke-width="1.6"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- fig_sphere step 2 -->
<text x="0.0" y="22.0" text-anchor="start" font-size="20" fill="#222222" font-weight="bold" font-style="normal">raw q, k</text>
<line x1="30.0" y1="250.0" x2="96.6" y2="228.4" stroke="#222222" stroke-width="2.6" marker-end="url(#arr)"/>
<line x1="30.0" y1="250.0" x2="130.3" y2="159.7" stroke="#C00000" stroke-width="2.6" marker-end="url(#arrPrb)"/>
<line x1="30.0" y1="250.0" x2="98.4" y2="62.1" stroke="#C00000" stroke-width="2.6" marker-end="url(#arrPrb)"/>
<circle cx="30" cy="250" r="3.5" fill="#222222"/>
<text x="0.0" y="50.0" text-anchor="start" font-size="17" fill="#C00000" font-weight="normal" font-style="italic"><tspan>length grows with ‖W</tspan><tspan baseline-shift="sub" font-size="12.2">q</tspan><tspan>‖</tspan></text>
<path d="M262,134 L348,134 L348,120 L372,150 L348,180 L348,166 L262,166 Z" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2"/>
<text x="309.0" y="108.0" text-anchor="middle" font-size="19" fill="#1F4E79" font-weight="bold" font-style="normal">RMSNorm</text>
<text x="309.0" y="206.0" text-anchor="middle" font-size="19" fill="#1F4E79" font-weight="bold" font-style="normal">per head</text>
<text x="404.0" y="22.0" text-anchor="start" font-size="20" fill="#1F4E79" font-weight="bold" font-style="normal">after QK-Norm</text>
<circle cx="506" cy="150" r="92" fill="none" stroke="#1F4E79" stroke-width="2" stroke-dasharray="6,4"/>
<line x1="506.0" y1="150.0" x2="593.5" y2="121.6" stroke="#1F4E79" stroke-width="2.6" marker-end="url(#arrAcc)"/>
<line x1="506.0" y1="150.0" x2="574.4" y2="88.4" stroke="#1F4E79" stroke-width="2.6" marker-end="url(#arrAcc)"/>
<line x1="506.0" y1="150.0" x2="537.5" y2="63.5" stroke="#1F4E79" stroke-width="2.6" marker-end="url(#arrAcc)"/>
<circle cx="506" cy="150" r="3.5" fill="#222222"/>
<text x="554.0" y="176.0" text-anchor="middle" font-size="18" fill="#1F4E79" font-weight="normal" font-style="normal"><tspan>radius √d</tspan></text>
<text x="506.0" y="264.0" text-anchor="middle" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">(unit gains)</text>
<path d="M542.3,50.4 A106,106 0 0 0 445.2,63.2" fill="none" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="431.2" y="67.2" text-anchor="end" font-size="17" fill="#222222" font-weight="normal" font-style="normal">RoPE rotates</text>
<rect x="644.0" y="60.0" width="224.0" height="196.0" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2.2" />
<text x="756.0" y="96.0" text-anchor="middle" font-size="20" fill="#1F4E79" font-weight="bold" font-style="normal"><tspan>max logit ≤ √d · g</tspan><tspan baseline-shift="sub" font-size="14.4">q</tspan><tspan> · g</tspan><tspan baseline-shift="sub" font-size="14.4">k</tspan></text>
<line x1="660.0" y1="118.0" x2="852.0" y2="118.0" stroke="#BFBFBF" stroke-width="1.2"/>
<text x="756.0" y="150.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">d = 128, unit gains</text>
<text x="756.0" y="188.0" text-anchor="middle" font-size="23" fill="#1F4E79" font-weight="bold" font-style="normal">max logit ≤ 11.3</text>
<text x="756.0" y="228.0" text-anchor="middle" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">g: max learned gain</text>
</svg>

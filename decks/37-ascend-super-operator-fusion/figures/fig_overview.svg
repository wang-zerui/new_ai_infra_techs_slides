<text x="480.0" y="154.0" text-anchor="start" font-size="16" fill="#1F4E79" font-weight="bold" font-style="normal">top-2048</text>
<text x="480.0" y="174.0" text-anchor="start" font-size="16" fill="#1F4E79" font-weight="bold" font-style="normal">token ids</text>
<rect x="180.0" y="250.0" width="214.0" height="44.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="287.0" y="277.6" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">index key cache</text>
<line x1="287.0" y1="250.0" x2="287.0" y2="215.0" stroke="#7F7F7F" stroke-width="2.2" marker-end="url(#arrGray)"/>

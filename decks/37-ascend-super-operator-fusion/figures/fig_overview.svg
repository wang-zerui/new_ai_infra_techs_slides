<text x="384.0" y="61.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">q</text>
<rect x="430.0" y="40.0" width="226.0" height="62.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="3" />
<text x="543.0" y="67.0" text-anchor="middle" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal">❸ Sparse Flash Attn</text>
<text x="543.0" y="87.7" text-anchor="middle" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal">gather KV · attend</text>
<line x1="656.0" y1="71.0" x2="688.0" y2="71.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="690.0" y="40.0" width="166.0" height="62.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="773.0" y="67.4" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">MoE block</text>
<text x="773.0" y="85.8" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">routing · GEMM</text>
<text x="773.0" y="122.0" text-anchor="middle" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="italic">no GLM-5 fusion claim</text>
<path d="M 60 102 L 60 181 L 162 181" fill="none" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="164.0" y="150.0" width="230.0" height="62.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="3" />
<text x="279.0" y="177.0" text-anchor="middle" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal">❷ Lightning Indexer</text>
<text x="279.0" y="197.7" text-anchor="middle" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal">score · ReLU · TopK</text>

<text x="856.0" y="190.0" text-anchor="end" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="italic">GPU indexer kernel: deck 10</text>
<text x="856.0" y="212.0" text-anchor="end" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="italic">Ascend stack: deck 23</text>
<text x="856.0" y="234.0" text-anchor="end" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="italic">GPU Mega MoE: deck 35</text>

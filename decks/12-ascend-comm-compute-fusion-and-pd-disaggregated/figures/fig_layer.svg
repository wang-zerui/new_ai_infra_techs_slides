<text x="240.0" y="163.3" text-anchor="middle" font-size="18" fill="#C00000" font-weight="bold" font-style="normal">All-to-all dispatch</text>
<line x1="240.0" y1="174.0" x2="240.0" y2="184.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="60.0" y="184.0" width="360.0" height="34.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="240.0" y="207.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">Experts (EP)</text>
<line x1="240.0" y1="218.0" x2="240.0" y2="228.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="60.0" y="228.0" width="360.0" height="34.0" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="2" />
<text x="240.0" y="251.3" text-anchor="middle" font-size="18" fill="#C00000" font-weight="bold" font-style="normal">All-to-all combine</text>
<line x1="240.0" y1="262.0" x2="240.0" y2="272.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="60.0" y="272.0" width="360.0" height="34.0" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="2" stroke-dasharray="6,4" />
<text x="240.0" y="295.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">Next layer</text>
<text x="10.0" y="326.0" text-anchor="start" font-size="17" fill="#7F7F7F" font-weight="normal" font-style="italic">3 dense + 75 MoE layers</text>
<text x="470.0" y="326.0" text-anchor="end" font-size="17" fill="#7F7F7F" font-weight="normal" font-style="italic">every token · every step</text>
</svg>

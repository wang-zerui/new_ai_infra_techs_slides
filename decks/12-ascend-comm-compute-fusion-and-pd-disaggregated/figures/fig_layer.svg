<text x="240.0" y="119.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">RMSNorm + router</text>
<line x1="240.0" y1="130.0" x2="240.0" y2="140.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>

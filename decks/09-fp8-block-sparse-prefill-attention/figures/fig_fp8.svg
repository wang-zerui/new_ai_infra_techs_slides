<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="296pt" viewBox="0 0 870 296" font-family="Helvetica, Arial, sans-serif">
  <!-- fig_fp8: per kept KV tile, FP8 QK wgmma, FP32 scaling/mask/softmax, P x256 to FP8, FP8 PV wgmma into fresh FP32 tile (slide figure, 1 unit = 1pt) -->
  <defs>
    <marker id="a_neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
    <marker id="a_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
    <marker id="a_prb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
    <marker id="a_acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
    <marker id="a_good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="1.6"/></pattern>
    <pattern id="hatchNeu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="1.6"/></pattern>
  </defs>
  <text x="4.0" y="20.0" font-size="18" fill="#595959" text-anchor="start" font-weight="bold">Scores</text>
  <rect x="4.0" y="30.0" width="118.0" height="58.0" rx="4" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="63.0" y="54.9" font-size="17" fill="#222222" text-anchor="middle">Q, K tiles</text>
  <text x="63.0" y="75.0" font-size="17" fill="#222222" text-anchor="middle">FP8</text>
  <line x1="123.0" y1="59.0" x2="144.0" y2="59.0" stroke="#7F7F7F" stroke-width="2.2" marker-end="url(#a_neu)"/>
  <rect x="146.0" y="30.0" width="138.0" height="58.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="215.0" y="54.9" font-size="17" fill="#1F4E79" text-anchor="middle">FP8 wgmma</text>
  <text x="215.0" y="75.0" font-size="17" fill="#1F4E79" text-anchor="middle">Q·Kᵀ</text>
  <line x1="285.0" y1="59.0" x2="306.0" y2="59.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#a_acc)"/>
  <rect x="308.0" y="30.0" width="150.0" height="58.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="383.0" y="54.9" font-size="17" fill="#1F4E79" text-anchor="middle">× q, k scales</text>
  <text x="383.0" y="75.0" font-size="17" fill="#1F4E79" text-anchor="middle">FP32</text>
  <line x1="459.0" y1="59.0" x2="480.0" y2="59.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#a_acc)"/>
  <rect x="482.0" y="30.0" width="172.0" height="58.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="568.0" y="54.9" font-size="17" fill="#222222" text-anchor="middle">Causal mask</text>
  <text x="568.0" y="75.0" font-size="17" fill="#222222" text-anchor="middle">diagonal tile only</text>
  <line x1="655.0" y1="59.0" x2="676.0" y2="59.0" stroke="#7F7F7F" stroke-width="2.2" marker-end="url(#a_neu)"/>
  <rect x="678.0" y="30.0" width="150.0" height="58.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="753.0" y="54.9" font-size="17" fill="#1F4E79" text-anchor="middle">Online softmax</text>
  <text x="753.0" y="75.0" font-size="17" fill="#1F4E79" text-anchor="middle">FP32</text>
  <text x="4.0" y="158.0" font-size="18" fill="#595959" text-anchor="start" font-weight="bold">Values</text>
  <rect x="4.0" y="168.0" width="132.0" height="58.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="70.0" y="192.9" font-size="17" fill="#1F4E79" text-anchor="middle">P × 256</text>
  <text x="70.0" y="213.0" font-size="17" fill="#1F4E79" text-anchor="middle">cast to FP8</text>
  <line x1="137.0" y1="197.0" x2="158.0" y2="197.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#a_acc)"/>
  <rect x="160.0" y="168.0" width="128.0" height="58.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="224.0" y="192.9" font-size="17" fill="#1F4E79" text-anchor="middle">FP8 wgmma</text>
  <text x="224.0" y="213.0" font-size="17" fill="#1F4E79" text-anchor="middle">P·V</text>
  <line x1="289.0" y1="197.0" x2="310.0" y2="197.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#a_acc)"/>
  <rect x="312.0" y="168.0" width="120.0" height="58.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="372.0" y="192.9" font-size="17" fill="#1F4E79" text-anchor="middle">Fresh FP32</text>
  <text x="372.0" y="213.0" font-size="17" fill="#1F4E79" text-anchor="middle">tile</text>
  <line x1="433.0" y1="197.0" x2="454.0" y2="197.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#a_acc)"/>
  <rect x="456.0" y="168.0" width="116.0" height="58.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="514.0" y="192.9" font-size="17" fill="#1F4E79" text-anchor="middle">O += tile</text>
  <text x="514.0" y="213.0" font-size="17" fill="#1F4E79" text-anchor="middle">FP32</text>
  <line x1="573.0" y1="197.0" x2="594.0" y2="197.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#a_acc)"/>
  <rect x="596.0" y="168.0" width="176.0" height="58.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="684.0" y="192.9" font-size="17" fill="#1F4E79" text-anchor="middle">After last tile</text>
  <text x="684.0" y="213.0" font-size="17" fill="#1F4E79" text-anchor="middle">× v-scale / 256</text>
  <path d="M753.0,89 L753.0,114 L70.0,114 L70.0,166" stroke="#1F4E79" stroke-width="2.2" fill="none" marker-end="url(#a_acc)"/>
  <text x="763.0" y="110.0" font-size="18" fill="#1F4E79" text-anchor="start" font-weight="bold">P</text>
  <rect x="174.0" y="252.0" width="100.0" height="40.0" rx="4" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="224.0" y="278.3" font-size="18" fill="#222222" text-anchor="middle">V tile FP8</text>
  <line x1="224.0" y1="251.0" x2="224.0" y2="228.0" stroke="#7F7F7F" stroke-width="2" marker-end="url(#a_neu)"/>
  <text x="772.0" y="272.0" font-size="18" fill="#1F4E79" text-anchor="end" font-weight="bold">O in BF16</text>
  <line x1="722.0" y1="227.0" x2="722.0" y2="252.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#a_acc)"/>
</svg>

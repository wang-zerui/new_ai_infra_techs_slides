<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="268pt" viewBox="0 0 870 268" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- fig_algo -->
<rect x="6.0" y="4.0" width="540.0" height="260.0" rx="6" fill="#FFFFFF" stroke="#595959" stroke-width="1.8" />
<rect x="10.0" y="132.0" width="532.0" height="128.0" rx="4" fill="#DEEBF7" stroke="none" stroke-width="0" />
<text x="18.0" y="25.2" text-anchor="start" font-size="18" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">for each training step t:</text>
<text x="39.6" y="49.2" text-anchor="start" font-size="18" fill="#7F7F7F" font-weight="bold" font-style="normal" font-family="Menlo, 'Courier New', monospace"># Muon: every weight matrix W (n×m)</text>
<text x="39.6" y="73.2" text-anchor="start" font-size="18" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">M ← μ·M + G</text>
<text x="39.6" y="97.2" text-anchor="start" font-size="18" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">O ← NewtonSchulz(M) · 0.2·√max(n,m)</text>
<text x="39.6" y="121.2" text-anchor="start" font-size="18" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">W ← W − η·(O + λ·W)</text>
<text x="39.6" y="151.2" text-anchor="start" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal" font-family="Menlo, 'Courier New', monospace"># QK-Clip: every attention head h</text>
<text x="39.6" y="175.2" text-anchor="start" font-size="18" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">if S_max[h] &gt; τ:</text>
<text x="61.2" y="199.2" text-anchor="start" font-size="18" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">γ ← τ / S_max[h]</text>
<text x="61.2" y="223.2" text-anchor="start" font-size="18" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">W_qc ← √γ·W_qc;  W_kc ← √γ·W_kc</text>
<text x="61.2" y="247.2" text-anchor="start" font-size="18" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">W_qr ← γ·W_qr    # shared k_R untouched</text>
<line x1="600.0" y1="90.0" x2="552.0" y2="92.4" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
<text x="606.0" y="90.0" text-anchor="start" font-size="19" fill="#222222" font-weight="bold" font-style="normal">update RMS matched</text>
<text x="606.0" y="113.0" text-anchor="start" font-size="18" fill="#222222" font-weight="normal" font-style="normal">to AdamW: reuse its LR</text>
<line x1="600.0" y1="166.0" x2="552.0" y2="170.4" stroke="#1F4E79" stroke-width="2" marker-end="url(#arrAcc)"/>
<text x="606.0" y="166.0" text-anchor="start" font-size="19" fill="#1F4E79" font-weight="bold" font-style="normal">reuses the forward&#x27;s</text>
<text x="606.0" y="189.0" text-anchor="start" font-size="18" fill="#222222" font-weight="normal" font-style="normal">per-head max logit</text>
<line x1="600.0" y1="230.0" x2="552.0" y2="230.4" stroke="#1F4E79" stroke-width="2" marker-end="url(#arrAcc)"/>
<text x="606.0" y="230.0" text-anchor="start" font-size="19" fill="#1F4E79" font-weight="bold" font-style="normal">runs after the update</text>
<text x="606.0" y="253.0" text-anchor="start" font-size="18" fill="#222222" font-weight="normal" font-style="normal">this step&#x27;s pass unchanged</text>
</svg>

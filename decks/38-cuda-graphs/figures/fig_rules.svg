<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="284pt" viewBox="0 0 870 284" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- fig_rules: graph requirements vs training behavior -->
<text x="130.0" y="20.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">a captured graph needs</text>
<text x="600.0" y="20.0" text-anchor="middle" font-size="18" fill="#C00000" font-weight="bold" font-style="normal">a training iteration has</text>
<rect x="2.0" y="34.0" width="256.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="130.0" y="60.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">fixed tensor shapes</text>
<rect x="330.0" y="34.0" width="538.0" height="40.0" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="2" />
<text x="599.0" y="60.3" text-anchor="middle" font-size="18" fill="#C00000" font-weight="normal" font-style="normal">dropless MoE: tokens per expert vary</text>
<text x="294.0" y="62.0" text-anchor="middle" font-size="24" fill="#C00000" font-weight="bold" font-style="normal">✗</text>
<rect x="2.0" y="84.0" width="256.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="130.0" y="110.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">no host sync inside</text>
<rect x="330.0" y="84.0" width="538.0" height="40.0" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="2" />
<text x="599.0" y="110.3" text-anchor="middle" font-size="18" fill="#C00000" font-weight="normal" font-style="normal">D2H token counts and NaN checks</text>
<text x="294.0" y="112.0" text-anchor="middle" font-size="24" fill="#C00000" font-weight="bold" font-style="normal">✗</text>
<rect x="2.0" y="134.0" width="256.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="130.0" y="160.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">fixed input addresses</text>
<rect x="330.0" y="134.0" width="538.0" height="40.0" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="2" />
<text x="599.0" y="160.3" text-anchor="middle" font-size="18" fill="#C00000" font-weight="normal" font-style="normal">fresh dataloader tensors every step</text>
<text x="294.0" y="162.0" text-anchor="middle" font-size="24" fill="#C00000" font-weight="bold" font-style="normal">✗</text>
<rect x="2.0" y="184.0" width="256.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="130.0" y="210.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">replay in capture order</text>
<rect x="330.0" y="184.0" width="538.0" height="40.0" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="2" />
<text x="599.0" y="210.3" text-anchor="middle" font-size="18" fill="#C00000" font-weight="normal" font-style="normal">PP interleaves microbatches in one pool</text>
<text x="294.0" y="212.0" text-anchor="middle" font-size="24" fill="#C00000" font-weight="bold" font-style="normal">✗</text>
<rect x="2.0" y="234.0" width="256.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="130.0" y="260.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">same work on every replay</text>
<rect x="330.0" y="234.0" width="538.0" height="40.0" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="2" />
<text x="599.0" y="260.3" text-anchor="middle" font-size="18" fill="#C00000" font-weight="normal" font-style="normal">FP8 amax reduce once per step, not per layer</text>
<text x="294.0" y="262.0" text-anchor="middle" font-size="24" fill="#C00000" font-weight="bold" font-style="normal">✗</text>
</svg>

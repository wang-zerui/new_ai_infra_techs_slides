<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="236pt" viewBox="0 0 870 236" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- fig_compose: 12 B -> 6 B -> 6/d B per rank -> host -->
<rect x="10.0" y="52.0" width="120.0" height="120.0" rx="3" fill="#FBE5E5" stroke="#C00000" stroke-width="2.2" />
<text x="70.0" y="196.0" text-anchor="middle" font-size="17" fill="#C00000" font-weight="bold" font-style="normal">12 B</text>
<text x="70.0" y="216.0" text-anchor="middle" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="normal">FP32 state</text>
<rect x="250.0" y="112.0" width="120.0" height="60.0" rx="3" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.2" />
<text x="310.0" y="196.0" text-anchor="middle" font-size="17" fill="#1F4E79" font-weight="bold" font-style="normal">6 B</text>
<text x="310.0" y="216.0" text-anchor="middle" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="normal">BF16 m v + remainder</text>
<rect x="490.0" y="112.0" width="120.0" height="15.0" rx="0" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<rect x="490.0" y="127.0" width="120.0" height="15.0" rx="0" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1" stroke-dasharray="3,2" />
<rect x="490.0" y="142.0" width="120.0" height="15.0" rx="0" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1" stroke-dasharray="3,2" />
<rect x="490.0" y="157.0" width="120.0" height="15.0" rx="0" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1" stroke-dasharray="3,2" />
<text x="550.0" y="196.0" text-anchor="middle" font-size="17" fill="#1F4E79" font-weight="bold" font-style="normal">6/d B</text>
<text x="550.0" y="216.0" text-anchor="middle" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="normal">per rank</text>
<rect x="730.0" y="112.0" width="120.0" height="60.0" rx="3" fill="#FFFFFF" stroke="#595959" stroke-width="2" stroke-dasharray="6,4" />
<text x="790.0" y="148.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal">host</text>
<text x="790.0" y="196.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal">optional</text>
<text x="790.0" y="216.0" text-anchor="middle" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="normal">offload</text>
<line x1="136.0" y1="132.0" x2="244.0" y2="132.0" stroke="#1F4E79" stroke-width="2.6" marker-end="url(#arrAcc)"/>
<text x="190.0" y="102.0" text-anchor="middle" font-size="16" fill="#1F4E79" font-weight="bold" font-style="normal">precision</text>
<text x="190.0" y="120.0" text-anchor="middle" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="normal">BF16 / FP8</text>
<line x1="376.0" y1="132.0" x2="484.0" y2="132.0" stroke="#1F4E79" stroke-width="2.6" marker-end="url(#arrAcc)"/>
<text x="430.0" y="102.0" text-anchor="middle" font-size="16" fill="#1F4E79" font-weight="bold" font-style="normal">shard over d</text>
<text x="430.0" y="120.0" text-anchor="middle" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="normal">dist-opt / FSDP</text>
<line x1="616.0" y1="132.0" x2="724.0" y2="132.0" stroke="#1F4E79" stroke-width="2.6" marker-end="url(#arrAcc)"/>
<text x="670.0" y="102.0" text-anchor="middle" font-size="16" fill="#1F4E79" font-weight="bold" font-style="normal">move</text>
<text x="670.0" y="120.0" text-anchor="middle" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="normal">fewer bytes</text>
</svg>

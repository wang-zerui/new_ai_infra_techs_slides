<text x="540.0" y="214.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">on the exact FP32 value</text>
<line x1="420.0" y1="197.0" x2="442.0" y2="197.0" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
<rect x="662.0" y="168.0" width="192.0" height="58.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="758.0" y="192.0" text-anchor="middle" font-size="17" fill="#1F4E79" font-weight="bold" font-style="normal">split</text>
<text x="758.0" y="214.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">w rounded to nearest</text>

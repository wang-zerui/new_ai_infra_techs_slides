<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="298pt"
     viewBox="0 0 870 298" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
  </defs>

  <!-- phase 1 -->
  <rect x="10" y="14" width="272" height="186" rx="6" fill="#FFFFFF" stroke="#595959" stroke-width="1.3"
        stroke-dasharray="5,3"/>
  <text x="146" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#595959">At the call site</text>
  <rect x="26" y="48" width="240" height="60" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="146" y="72" text-anchor="middle" font-size="17" fill="#222222">shape is known now:</text>
  <text x="146" y="94" text-anchor="middle" font-size="17" font-family="Menlo, 'Courier New', monospace" fill="#222222">m dynamic, n/k fixed</text>
  <line x1="146" y1="108" x2="146" y2="122" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="26" y="124" width="240" height="62" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="146" y="148" text-anchor="middle" font-size="17" fill="#222222">rank tile candidates:</text>
  <text x="146" y="170" text-anchor="middle" font-size="17" fill="#222222">waves, cluster, last wave</text>

  <!-- phase 2 -->
  <rect x="302" y="14" width="272" height="186" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.3"
        stroke-dasharray="5,3"/>
  <text x="438" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F4E79">DeepJIT</text>
  <rect x="318" y="48" width="240" height="60" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="438" y="72" text-anchor="middle" font-size="17" fill="#222222">emit kernel.cu with</text>
  <text x="438" y="94" text-anchor="middle" font-size="17" fill="#222222">~25 constants</text>
  <line x1="438" y1="108" x2="438" y2="122" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="318" y="124" width="240" height="62" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="438" y="148" text-anchor="middle" font-size="17" fill="#222222">digest -&gt; cache hit loads</text>
  <text x="438" y="170" text-anchor="middle" font-size="17" fill="#222222">cubin, miss runs NVCC</text>

  <!-- phase 3 -->
  <rect x="594" y="14" width="266" height="186" rx="6" fill="#FFFFFF" stroke="#595959" stroke-width="1.3"
        stroke-dasharray="5,3"/>
  <text x="727" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#595959">Launch</text>
  <rect x="610" y="48" width="234" height="60" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="727" y="72" text-anchor="middle" font-size="17" fill="#222222">driver launch with</text>
  <text x="727" y="94" text-anchor="middle" font-size="17" fill="#222222">cluster and PDL</text>
  <line x1="727" y1="108" x2="727" y2="122" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="610" y="124" width="234" height="62" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="727" y="148" text-anchor="middle" font-size="17" fill="#222222">SM budget, tc_util and</text>
  <text x="727" y="170" text-anchor="middle" font-size="17" fill="#222222">determinism already baked</text>

  <!-- phase hand-offs: fat hollow arrows -->
  <path d="M284,96 L284,82 L300,107 L284,132 L284,118 Z" fill="#FFFFFF" stroke="#222222" stroke-width="1.4"/>
  <path d="M576,96 L576,82 L592,107 L576,132 L576,118 Z" fill="#FFFFFF" stroke="#222222" stroke-width="1.4"/>

  <!-- shared cache strip -->
  <rect x="10" y="222" width="850" height="60" rx="5" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="435" y="246" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">Disk cache keyed by the digest</text>
  <text x="435" y="270" text-anchor="middle" font-size="17" fill="#222222">source · tracked includes · NVCC version · effective flags · post hook (published by atomic rename)</text>
  <line x1="438" y1="200" x2="438" y2="218" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="520" y1="218" x2="520" y2="200" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
</svg>

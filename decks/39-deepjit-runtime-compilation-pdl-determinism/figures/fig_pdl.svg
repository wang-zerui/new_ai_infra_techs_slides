<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="286pt"
     viewBox="0 0 870 286" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
    <pattern id="hatchGray" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#F2F2F2"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7F7F7F" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- ===== (a) without PDL ===== -->
  <text x="10" y="24" font-size="19" font-weight="bold" fill="#222222">(a) Without PDL</text>

  <text x="118" y="62" text-anchor="end" font-size="17" fill="#595959">GEMM A</text>
  <rect x="130" y="40" width="300" height="34" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="280" y="63" text-anchor="middle" font-size="17" fill="#222222">main loop</text>
  <rect x="430" y="40" width="60" height="34" fill="url(#hatchGray)" stroke="#595959" stroke-width="1.2"/>
  <text x="460" y="63" text-anchor="middle" font-size="15" fill="#222222">tail</text>

  <text x="118" y="110" text-anchor="end" font-size="17" fill="#595959">GEMM B</text>
  <rect x="490" y="88" width="86" height="34" fill="#FBE5E5" stroke="#C00000" stroke-width="1.3"/>
  <text x="533" y="111" text-anchor="middle" font-size="15" fill="#222222">prologue</text>
  <rect x="576" y="88" width="240" height="34" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="696" y="111" text-anchor="middle" font-size="17" fill="#222222">main loop</text>

  <line x1="490" y1="74" x2="490" y2="88" stroke="#C00000" stroke-width="1.6"/>
  <text x="500" y="142" font-size="17" font-weight="bold" fill="#C00000">prologue starts only after A retires</text>
  <text x="500" y="164" font-size="17" fill="#C00000">barriers, tensor memory, register setup</text>

  <!-- ===== (b) with PDL ===== -->
  <text x="10" y="186" font-size="19" font-weight="bold" fill="#222222">(b) With PDL</text>

  <text x="118" y="224" text-anchor="end" font-size="17" fill="#595959">GEMM A</text>
  <rect x="130" y="202" width="300" height="34" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="280" y="225" text-anchor="middle" font-size="17" fill="#222222">main loop</text>
  <rect x="430" y="202" width="60" height="34" fill="url(#hatchGray)" stroke="#595959" stroke-width="1.2"/>
  <text x="460" y="225" text-anchor="middle" font-size="15" fill="#222222">tail</text>

  <text x="118" y="272" text-anchor="end" font-size="17" fill="#595959">GEMM B</text>
  <rect x="404" y="250" width="86" height="34" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="447" y="273" text-anchor="middle" font-size="15" fill="#222222">prologue</text>
  <rect x="490" y="250" width="240" height="34" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="610" y="273" text-anchor="middle" font-size="17" fill="#222222">main loop</text>

  <line x1="490" y1="194" x2="490" y2="290" stroke="#1F4E79" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="500" y="192" font-size="17" font-weight="bold" fill="#1F4E79">cudaGridDependencySynchronize()</text>
  <text x="744" y="273" font-size="17" fill="#222222">ends earlier</text>
</svg>

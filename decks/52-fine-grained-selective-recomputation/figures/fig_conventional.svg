<text x="545.0" y="134.9" text-anchor="middle" font-size="17" fill="#222222" font-weight="normal" font-style="normal">z (own input)</text>
<rect x="704.0" y="112.0" width="150.0" height="34.0" rx="9" fill="#FBE5E5" stroke="#C00000" stroke-width="2.2" />
<text x="779.0" y="134.9" text-anchor="middle" font-size="17" fill="#C00000" font-weight="bold" font-style="normal">a (fc2 input)</text>
<line x1="545.0" y1="94.0" x2="545.0" y2="110.0" stroke="#7F7F7F" stroke-width="1.6" marker-end="url(#arrGray)"/>
<line x1="779.0" y1="94.0" x2="779.0" y2="110.0" stroke="#C00000" stroke-width="1.8" marker-end="url(#arrPrb)"/>
<text x="545.0" y="172.0" text-anchor="middle" font-size="17" fill="#7F7F7F" font-weight="normal" font-style="italic">kept for its own backward</text>
<text x="779.0" y="172.0" text-anchor="middle" font-size="17" fill="#C00000" font-weight="normal" font-style="italic">kept by the consumer</text>
<text x="653.0" y="222.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">output stays alive anyway</text>
<text x="653.0" y="248.0" text-anchor="middle" font-size="18" fill="#C00000" font-weight="bold" font-style="normal">nothing freed</text>
</svg>

<text x="104.0" y="174.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">Attn</text>
<rect x="152.0" y="148.0" width="94.0" height="40.0" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="2" />
<text x="199.0" y="174.3" text-anchor="middle" font-size="18" fill="#C00000" font-weight="bold" font-style="normal">dispatch</text>

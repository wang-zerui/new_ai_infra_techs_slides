<text x="218.0" y="222.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">whole layer replayed in backward</text>
<text x="218.0" y="248.0" text-anchor="middle" font-size="18" fill="#C00000" font-weight="bold" font-style="normal">incl. EP all-to-all</text>
<text x="653.0" y="22.0" text-anchor="middle" font-size="20" fill="#222222" font-weight="bold" font-style="normal">(b) Checkpoint of one op</text>

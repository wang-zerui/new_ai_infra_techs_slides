<text x="575.0" y="224.0" text-anchor="middle" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">bwd</text>
<line x1="762.0" y1="115.0" x2="762.0" y2="157.0" stroke="#1F4E79" stroke-width="2.4" marker-end="url(#arrAcc)"/>

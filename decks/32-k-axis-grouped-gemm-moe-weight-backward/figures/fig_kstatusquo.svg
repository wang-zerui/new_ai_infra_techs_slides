<text x="258.0" y="159.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold" font-style="normal">dW0</text>
<rect x="310.0" y="138.0" width="26.0" height="30.0" rx="0" fill="url(#hatchPrb)" stroke="#C00000" stroke-width="1" />

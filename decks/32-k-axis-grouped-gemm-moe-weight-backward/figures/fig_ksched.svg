<text x="452.0" y="206.0" text-anchor="start" font-size="15" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, monospace">    acc += A[kb,m].T @ B[kb,n]</text>
<text x="852.0" y="206.0" text-anchor="end" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="italic">FP8 MMA</text>
<text x="452.0" y="239.0" text-anchor="start" font-size="15" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, monospace">  D[g][m, n] = acc</text>

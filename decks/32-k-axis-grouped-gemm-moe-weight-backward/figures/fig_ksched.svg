<rect x="446.0" y="153.0" width="408.0" height="28.0" rx="3" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.2" />
<text x="452.0" y="173.0" text-anchor="start" font-size="15" fill="#1F4E79" font-weight="bold" font-style="normal" font-family="Menlo, Consolas, monospace">  for kb in k_blocks(g):</text>

<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="330pt"
     viewBox="0 0 870 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
  </defs>

  <!-- ===== common top band: TMA loads ===== -->
  <rect x="10" y="12" width="850" height="60" rx="5" fill="#FFFFFF" stroke="#595959" stroke-width="1.3"/>
  <text x="24" y="32" font-size="17" fill="#595959">TMA loads per K block</text>
  <rect x="236" y="22" width="140" height="38" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="306" y="46" text-anchor="middle" font-size="17" fill="#222222">A tile FP8</text>
  <rect x="384" y="22" width="140" height="38" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="454" y="46" text-anchor="middle" font-size="17" fill="#222222">SFA</text>
  <rect x="532" y="22" width="156" height="38" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="610" y="46" text-anchor="middle" font-size="17" fill="#222222">B tile FP8 / FP4</text>
  <rect x="696" y="22" width="140" height="38" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="766" y="46" text-anchor="middle" font-size="17" fill="#222222">SFB</text>

  <line x1="215" y1="72" x2="215" y2="88" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="650" y1="72" x2="650" y2="88" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== panel (a): SM90 ===== -->
  <text x="18" y="112" font-size="19" font-weight="bold" fill="#222222">(a) SM90: promote to CUDA cores</text>

  <rect x="30" y="124" width="370" height="40" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="215" y="149" text-anchor="middle" font-size="17" fill="#222222">4 WGMMAs over BLOCK_K = 128</text>
  <line x1="215" y1="164" x2="215" y2="176" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="30" y="178" width="370" height="40" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="1.4"/>
  <text x="215" y="203" text-anchor="middle" font-size="17" fill="#222222">tensor-core accumulator: ~14 bits</text>
  <line x1="215" y1="218" x2="215" y2="230" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="30" y="232" width="370" height="40" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="215" y="257" text-anchor="middle" font-size="17" fill="#222222">CUDA cores multiply by SFA x SFB</text>
  <line x1="215" y1="272" x2="215" y2="284" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="30" y="286" width="370" height="38" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.2"/>
  <text x="215" y="310" text-anchor="middle" font-size="17" fill="#222222">FP32 accumulator in registers</text>

  <!-- divider -->
  <line x1="430" y1="100" x2="430" y2="324" stroke="#A6A6A6" stroke-width="1"/>

  <!-- ===== panel (b): SM100 ===== -->
  <text x="460" y="112" font-size="19" font-weight="bold" fill="#222222">(b) SM100: block-scaled tensor core</text>

  <rect x="465" y="124" width="370" height="40" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="650" y="149" text-anchor="middle" font-size="17" fill="#222222">SF copied into tensor memory</text>
  <line x1="650" y1="164" x2="650" y2="176" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="465" y="178" width="370" height="40" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="650" y="203" text-anchor="middle" font-size="17" fill="#222222">MMA applies SF per 32 or 128 K</text>
  <line x1="650" y1="218" x2="650" y2="230" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="465" y="232" width="370" height="40" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.2"/>
  <text x="650" y="257" text-anchor="middle" font-size="17" fill="#222222">FP32 accumulator in tensor memory</text>

  <text x="650" y="300" text-anchor="middle" font-size="17" fill="#222222">scales are an operand of the</text>
  <text x="650" y="320" text-anchor="middle" font-size="17" fill="#222222">MMA instruction, not a fix-up</text>
</svg>

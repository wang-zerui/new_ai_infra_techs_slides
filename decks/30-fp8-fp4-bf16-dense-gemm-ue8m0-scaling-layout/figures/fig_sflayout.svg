<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="258pt"
     viewBox="0 0 870 258" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
    <pattern id="hatchGray" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#F2F2F2"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7F7F7F" stroke-width="1.8"/>
    </pattern>
  </defs>

  <!-- ===== panel (a): packing ===== -->
  <text x="10" y="24" font-size="19" font-weight="bold" fill="#222222">(a) Four UE8M0 exponents per int32</text>

  <rect x="14" y="40" width="92" height="42" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.2"/>
  <text x="60" y="58" text-anchor="middle" font-size="16" fill="#222222">sf[4k]</text>
  <text x="60" y="76" text-anchor="middle" font-size="16" fill="#222222">= 2^e0</text>
  <rect x="112" y="40" width="92" height="42" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.2"/>
  <text x="158" y="58" text-anchor="middle" font-size="16" fill="#222222">sf[4k+1]</text>
  <text x="158" y="76" text-anchor="middle" font-size="16" fill="#222222">= 2^e1</text>
  <rect x="210" y="40" width="92" height="42" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.2"/>
  <text x="256" y="58" text-anchor="middle" font-size="16" fill="#222222">sf[4k+2]</text>
  <text x="256" y="76" text-anchor="middle" font-size="16" fill="#222222">= 2^e2</text>
  <rect x="308" y="40" width="92" height="42" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.2"/>
  <text x="354" y="58" text-anchor="middle" font-size="16" fill="#222222">sf[4k+3]</text>
  <text x="354" y="76" text-anchor="middle" font-size="16" fill="#222222">= 2^e3</text>

  <line x1="60" y1="84" x2="60" y2="112" stroke="#222222" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="158" y1="84" x2="158" y2="112" stroke="#222222" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="256" y1="84" x2="256" y2="112" stroke="#222222" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="354" y1="84" x2="354" y2="112" stroke="#222222" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="14" y="114" width="386" height="44" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
  <line x1="110.5" y1="114" x2="110.5" y2="158" stroke="#1F4E79" stroke-width="1"/>
  <line x1="207" y1="114" x2="207" y2="158" stroke="#1F4E79" stroke-width="1"/>
  <line x1="303.5" y1="114" x2="303.5" y2="158" stroke="#1F4E79" stroke-width="1"/>
  <text x="62" y="142" text-anchor="middle" font-size="17" fill="#222222">e0</text>
  <text x="159" y="142" text-anchor="middle" font-size="17" fill="#222222">e1</text>
  <text x="255" y="142" text-anchor="middle" font-size="17" fill="#222222">e2</text>
  <text x="352" y="142" text-anchor="middle" font-size="17" fill="#222222">e3</text>
  <text x="62" y="176" text-anchor="middle" font-size="15" fill="#595959">bits 7:0</text>
  <text x="159" y="176" text-anchor="middle" font-size="15" fill="#595959">15:8</text>
  <text x="255" y="176" text-anchor="middle" font-size="15" fill="#595959">23:16</text>
  <text x="352" y="176" text-anchor="middle" font-size="15" fill="#595959">31:24</text>

  <text x="14" y="206" font-size="17" fill="#222222">one int32 covers 4 x gran_k elements of K</text>
  <text x="14" y="230" font-size="17" fill="#222222">scales must be exact powers of two</text>

  <line x1="425" y1="14" x2="425" y2="244" stroke="#A6A6A6" stroke-width="1"/>

  <!-- ===== panel (b): MN-major layout ===== -->
  <text x="446" y="24" font-size="19" font-weight="bold" fill="#222222">(b) MN-major with TMA padding (mn = 6)</text>

  <text x="446" y="52" font-size="16" fill="#595959">K-slice 0</text>
  <g>
    <rect x="530" y="36" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="551" y="56" text-anchor="middle" font-size="15" fill="#222222">m0</text>
    <rect x="572" y="36" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="593" y="56" text-anchor="middle" font-size="15" fill="#222222">m1</text>
    <rect x="614" y="36" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="635" y="56" text-anchor="middle" font-size="15" fill="#222222">m2</text>
    <rect x="656" y="36" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="677" y="56" text-anchor="middle" font-size="15" fill="#222222">m3</text>
    <rect x="698" y="36" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="719" y="56" text-anchor="middle" font-size="15" fill="#222222">m4</text>
    <rect x="740" y="36" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="761" y="56" text-anchor="middle" font-size="15" fill="#222222">m5</text>
    <rect x="782" y="36" width="42" height="30" fill="url(#hatchGray)" stroke="#7F7F7F" stroke-width="1.1"/>
    <rect x="824" y="36" width="42" height="30" fill="url(#hatchGray)" stroke="#7F7F7F" stroke-width="1.1"/>
  </g>

  <text x="446" y="100" font-size="16" fill="#595959">K-slice 1</text>
  <g>
    <rect x="530" y="84" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="551" y="104" text-anchor="middle" font-size="15" fill="#222222">m0</text>
    <rect x="572" y="84" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="593" y="104" text-anchor="middle" font-size="15" fill="#222222">m1</text>
    <rect x="614" y="84" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="635" y="104" text-anchor="middle" font-size="15" fill="#222222">m2</text>
    <rect x="656" y="84" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="677" y="104" text-anchor="middle" font-size="15" fill="#222222">m3</text>
    <rect x="698" y="84" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="719" y="104" text-anchor="middle" font-size="15" fill="#222222">m4</text>
    <rect x="740" y="84" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="761" y="104" text-anchor="middle" font-size="15" fill="#222222">m5</text>
    <rect x="782" y="84" width="42" height="30" fill="url(#hatchGray)" stroke="#7F7F7F" stroke-width="1.1"/>
    <rect x="824" y="84" width="42" height="30" fill="url(#hatchGray)" stroke="#7F7F7F" stroke-width="1.1"/>
  </g>

  <text x="446" y="148" font-size="16" fill="#595959">K-slice 2</text>
  <g>
    <rect x="530" y="132" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="551" y="152" text-anchor="middle" font-size="15" fill="#222222">m0</text>
    <rect x="572" y="132" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="593" y="152" text-anchor="middle" font-size="15" fill="#222222">m1</text>
    <rect x="614" y="132" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="635" y="152" text-anchor="middle" font-size="15" fill="#222222">m2</text>
    <rect x="656" y="132" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="677" y="152" text-anchor="middle" font-size="15" fill="#222222">m3</text>
    <rect x="698" y="132" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="719" y="152" text-anchor="middle" font-size="15" fill="#222222">m4</text>
    <rect x="740" y="132" width="42" height="30" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.1"/>
    <text x="761" y="152" text-anchor="middle" font-size="15" fill="#222222">m5</text>
    <rect x="782" y="132" width="42" height="30" fill="url(#hatchGray)" stroke="#7F7F7F" stroke-width="1.1"/>
    <rect x="824" y="132" width="42" height="30" fill="url(#hatchGray)" stroke="#7F7F7F" stroke-width="1.1"/>
  </g>

  <line x1="530" y1="174" x2="866" y2="174" stroke="#595959" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="530" y="194" font-size="16" fill="#595959">increasing memory offset</text>

  <text x="446" y="222" font-size="17" fill="#222222">stride(-2) = 1, stride(-1) = align(6, 4) = 8</text>
  <text x="446" y="244" font-size="17" fill="#222222">hatched slots exist only for 16-byte TMA alignment</text>
</svg>

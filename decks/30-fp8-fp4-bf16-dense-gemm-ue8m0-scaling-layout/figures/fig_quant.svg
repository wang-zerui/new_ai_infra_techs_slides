<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="292pt"
     viewBox="0 0 870 292" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C00000"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>

  <!-- ===== panel (a): per-tensor scale ===== -->
  <text x="10" y="24" font-size="19" font-weight="bold" fill="#222222">(a) One scale per tensor</text>

  <text x="80" y="72" text-anchor="end" font-size="17" fill="#595959">one token</text>
  <rect x="92" y="44" width="130" height="44" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="157" y="72" text-anchor="middle" font-size="17" fill="#222222">ch 0-127</text>
  <rect x="222" y="44" width="130" height="44" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="287" y="72" text-anchor="middle" font-size="17" fill="#222222">ch 128-255</text>
  <rect x="352" y="44" width="130" height="44" fill="#FBE5E5" stroke="#C00000" stroke-width="1.6"/>
  <text x="417" y="64" text-anchor="middle" font-size="16" fill="#222222">ch 256-383</text>
  <text x="417" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#C00000">outlier</text>
  <rect x="482" y="44" width="130" height="44" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="547" y="72" text-anchor="middle" font-size="17" fill="#222222">ch 384-511</text>

  <path d="M92,96 L92,104 L612,104 L612,96" fill="none" stroke="#595959" stroke-width="1.2"/>
  <line x1="352" y1="104" x2="352" y2="120" stroke="#595959" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="640" y="46" width="112" height="40" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="696" y="72" text-anchor="middle" font-size="17" fill="#222222">one scale</text>
  <line x1="614" y1="66" x2="636" y2="66" stroke="#595959" stroke-width="1.4" marker-end="url(#arr)"/>

  <text x="352" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#C00000">the outlier sets the scale for all 512 channels</text>

  <!-- ===== panel (b): fine-grained ===== -->
  <text x="10" y="186" font-size="19" font-weight="bold" fill="#222222">(b) One scale per 1x128 tile</text>

  <rect x="92" y="200" width="130" height="34" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="157" y="223" text-anchor="middle" font-size="17" fill="#222222">SF 0</text>
  <rect x="222" y="200" width="130" height="34" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="287" y="223" text-anchor="middle" font-size="17" fill="#222222">SF 1</text>
  <rect x="352" y="200" width="130" height="34" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="417" y="223" text-anchor="middle" font-size="17" fill="#222222">SF 2</text>
  <rect x="482" y="200" width="130" height="34" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="547" y="223" text-anchor="middle" font-size="17" fill="#222222">SF 3</text>

  <line x1="157" y1="236" x2="157" y2="248" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <line x1="287" y1="236" x2="287" y2="248" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <line x1="417" y1="236" x2="417" y2="248" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <line x1="547" y1="236" x2="547" y2="248" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#arrBlue)"/>

  <rect x="92" y="250" width="130" height="38" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="157" y="275" text-anchor="middle" font-size="17" fill="#222222">ch 0-127</text>
  <rect x="222" y="250" width="130" height="38" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="287" y="275" text-anchor="middle" font-size="17" fill="#222222">ch 128-255</text>
  <rect x="352" y="250" width="130" height="38" fill="#FBE5E5" stroke="#C00000" stroke-width="1.6"/>
  <text x="417" y="267" text-anchor="middle" font-size="16" fill="#222222">ch 256-383</text>
  <text x="417" y="283" text-anchor="middle" font-size="16" font-weight="bold" fill="#C00000">outlier</text>
  <rect x="482" y="250" width="130" height="38" fill="#F2F2F2" stroke="#595959" stroke-width="1.2"/>
  <text x="547" y="275" text-anchor="middle" font-size="17" fill="#222222">ch 384-511</text>

  <text x="640" y="223" font-size="18" font-weight="bold" fill="#1F4E79">SF = UE8M0 exponent</text>
  <text x="640" y="247" font-size="17" fill="#222222">weights scale per</text>
  <text x="640" y="269" font-size="17" fill="#222222">128x128 block</text>
</svg>

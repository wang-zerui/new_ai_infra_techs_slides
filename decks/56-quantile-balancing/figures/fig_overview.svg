<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="300pt" viewBox="0 0 870 300" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- fig_overview: QB data flow in one training step -->
<text x="8.0" y="22.0" text-anchor="start" font-size="17" fill="#7F7F7F" font-weight="normal" font-style="italic">every micro-batch, forward</text>
<line x1="8.0" y1="182.0" x2="862.0" y2="182.0" stroke="#A6A6A6" stroke-width="1.5" stroke-dasharray="6,5"/>
<text x="8.0" y="204.0" text-anchor="start" font-size="17" fill="#7F7F7F" font-weight="normal" font-style="italic">once per step</text>
<rect x="10.0" y="74.0" width="150.0" height="60.0" rx="5" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="85.0" y="99.2" text-anchor="middle" font-size="19"><tspan fill="#222222" font-weight="normal" font-style="normal">router</tspan></text>
<text x="85.0" y="122.0" text-anchor="middle" font-size="19"><tspan fill="#222222" font-weight="bold" font-style="italic">s</tspan><tspan fill="#222222" font-weight="normal" font-style="normal"> = σ(W</tspan><tspan fill="#222222" font-weight="normal" font-size="12.9" baseline-shift="-0.28em">r</tspan><tspan fill="#222222" font-weight="normal" font-style="normal">x)</tspan></text>
<rect x="200.0" y="74.0" width="200.0" height="60.0" rx="5" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="300.0" y="99.2" text-anchor="middle" font-size="19"><tspan fill="#1F4E79" font-weight="bold" font-style="normal">Top-(k+1)</tspan></text>
<text x="300.0" y="122.0" text-anchor="middle" font-size="19"><tspan fill="#222222" font-weight="normal" font-style="normal">of </tspan><tspan fill="#222222" font-weight="bold" font-style="italic">s</tspan><tspan fill="#222222" font-weight="normal" font-style="normal"> + </tspan><tspan fill="#222222" font-weight="bold" font-style="italic">b</tspan><tspan fill="#222222" font-weight="normal" font-style="normal">(t)</tspan></text>
<circle cx="200.0" cy="74.0" r="13" fill="#1F4E79" stroke="#1F4E79" stroke-width="1"/>
<text x="200.0" y="80.1" text-anchor="middle" font-size="17" fill="#FFFFFF" font-weight="bold" font-style="normal">1</text>
<line x1="162.0" y1="104.0" x2="199.0" y2="104.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="470.0" y="30.0" width="390.0" height="46.0" rx="5" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="665.0" y="59.6" text-anchor="middle" font-size="19"><tspan fill="#222222" font-weight="normal" font-style="normal">first k → dispatch to experts</tspan></text>
<rect x="470.0" y="112.0" width="150.0" height="58.0" rx="5" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="545.0" y="147.7" text-anchor="middle" font-size="19"><tspan fill="#222222" font-weight="normal" font-style="normal">cutoff </tspan><tspan fill="#222222" font-weight="bold" font-style="italic">α</tspan><tspan fill="#222222" font-weight="normal" font-size="12.9" baseline-shift="-0.28em">i</tspan></text>
<rect x="690.0" y="112.0" width="170.0" height="58.0" rx="5" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="775.0" y="136.5" text-anchor="middle" font-size="18"><tspan fill="#222222" font-weight="normal" font-style="normal">local histogram</tspan></text>
<text x="775.0" y="158.1" text-anchor="middle" font-size="18"><tspan fill="#222222" font-weight="normal" font-style="normal">n × B counts</tspan></text>
<circle cx="838.0" cy="112.0" r="13" fill="#1F4E79" stroke="#1F4E79" stroke-width="1"/>
<text x="838.0" y="118.1" text-anchor="middle" font-size="17" fill="#FFFFFF" font-weight="bold" font-style="normal">3</text>
<path d="M 402 92 H 436 V 53 H 469" fill="none" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M 402 116 H 436 V 141 H 469" fill="none" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="622.0" y1="141.0" x2="689.0" y2="141.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="655.0" y="128.0" text-anchor="middle" font-size="17"><tspan fill="#222222" font-weight="normal" font-style="italic">α</tspan><tspan fill="#222222" font-weight="normal" font-size="11.6" baseline-shift="-0.28em">i</tspan><tspan fill="#222222" font-weight="normal" font-style="normal"> − </tspan><tspan fill="#222222" font-weight="normal" font-style="italic">s</tspan><tspan fill="#222222" font-weight="normal" font-size="11.6" baseline-shift="-0.28em">ij</tspan></text>
<rect x="690.0" y="222.0" width="170.0" height="52.0" rx="5" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="775.0" y="254.7" text-anchor="middle" font-size="19"><tspan fill="#222222" font-weight="normal" font-style="normal">all-reduce counts</tspan></text>
<rect x="400.0" y="222.0" width="250.0" height="52.0" rx="5" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="525.0" y="254.7" text-anchor="middle" font-size="19"><tspan fill="#222222" font-weight="normal" font-style="normal">quantile at rank </tspan><tspan fill="#222222" font-weight="normal" font-style="italic">q</tspan><tspan fill="#222222" font-weight="normal" font-style="normal"> → </tspan><tspan fill="#222222" font-weight="bold" font-style="italic">b̂</tspan><tspan fill="#222222" font-weight="normal" font-size="12.9" baseline-shift="-0.28em">j</tspan></text>
<circle cx="400.0" cy="222.0" r="13" fill="#1F4E79" stroke="#1F4E79" stroke-width="1"/>
<text x="400.0" y="228.1" text-anchor="middle" font-size="17" fill="#FFFFFF" font-weight="bold" font-style="normal">2</text>
<rect x="130.0" y="222.0" width="230.0" height="52.0" rx="5" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="245.0" y="254.7" text-anchor="middle" font-size="19"><tspan fill="#222222" font-weight="bold" font-style="italic">b</tspan><tspan fill="#222222" font-weight="normal" font-style="normal">(t+1)</tspan><tspan fill="#222222" font-weight="normal" font-style="normal"> = </tspan><tspan fill="#222222" font-weight="bold" font-style="italic">b̂</tspan><tspan fill="#222222" font-weight="normal" font-style="normal"> − mean</tspan></text>
<line x1="775.0" y1="172.0" x2="775.0" y2="221.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="688.0" y1="248.0" x2="651.0" y2="248.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="398.0" y1="248.0" x2="361.0" y2="248.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M 245 222 V 136" fill="none" stroke="#1F4E79" stroke-width="2.4" marker-end="url(#arrAcc)"/>
<text x="253.0" y="172.0" text-anchor="start" font-size="17" fill="#1F4E79" font-weight="normal" font-style="italic">next step</text>
</svg>

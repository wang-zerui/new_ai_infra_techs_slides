<svg xmlns="http://www.w3.org/2000/svg" width="480pt" height="300pt" viewBox="0 0 480 300" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- fig_hook: per-GPU expert compute in one MoE layer; imbalance = idle GPUs -->
<text x="96.0" y="32.0" text-anchor="start" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">expert compute in one MoE layer</text>
<text x="84.0" y="76.3" text-anchor="end" font-size="18" fill="#222222" font-weight="normal" font-style="normal">GPU 0</text>
<rect x="96.0" y="50.0" width="340.0" height="40.0" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="2" />
<text x="266.0" y="76.3" text-anchor="middle" font-size="18" fill="#C00000" font-weight="bold" font-style="normal">E0 · hot expert</text>
<text x="84.0" y="130.3" text-anchor="end" font-size="18" fill="#222222" font-weight="normal" font-style="normal">GPU 1</text>
<rect x="96.0" y="104.0" width="184.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="188.0" y="130.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">E1</text>
<rect x="280.0" y="104.0" width="156.0" height="40.0" rx="4" fill="url(#hatchGray)" stroke="#A6A6A6" stroke-width="1.5" />
<text x="358.0" y="130.3" text-anchor="middle" font-size="17" fill="#7F7F7F" font-weight="bold" font-style="normal" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">idle</text>
<text x="84.0" y="184.3" text-anchor="end" font-size="18" fill="#222222" font-weight="normal" font-style="normal">GPU 2</text>
<rect x="96.0" y="158.0" width="144.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="168.0" y="184.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">E2</text>
<rect x="240.0" y="158.0" width="196.0" height="40.0" rx="4" fill="url(#hatchGray)" stroke="#A6A6A6" stroke-width="1.5" />
<text x="338.0" y="184.3" text-anchor="middle" font-size="17" fill="#7F7F7F" font-weight="bold" font-style="normal" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">idle</text>
<text x="84.0" y="238.3" text-anchor="end" font-size="18" fill="#222222" font-weight="normal" font-style="normal">GPU 3</text>
<rect x="96.0" y="212.0" width="216.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="204.0" y="238.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">E3</text>
<rect x="312.0" y="212.0" width="124.0" height="40.0" rx="4" fill="url(#hatchGray)" stroke="#A6A6A6" stroke-width="1.5" />
<text x="374.0" y="238.3" text-anchor="middle" font-size="17" fill="#7F7F7F" font-weight="bold" font-style="normal" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">idle</text>
<line x1="442.0" y1="42.0" x2="442.0" y2="262.0" stroke="#C00000" stroke-width="2.2" stroke-dasharray="6,4"/>
<text x="438.0" y="284.0" text-anchor="end" font-size="17" fill="#C00000" font-weight="bold" font-style="normal">combine waits</text>
<line x1="96.0" y1="272.0" x2="300.0" y2="272.0" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
<text x="96.0" y="292.0" text-anchor="start" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">time</text>
</svg>

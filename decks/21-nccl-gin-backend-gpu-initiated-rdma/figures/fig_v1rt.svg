<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="262pt"
     viewBox="0 0 870 262" font-family="Helvetica, Arial, sans-serif">
  <!-- fig_v1rt: DeepEP V1 brought its own communication runtime next to the job's NCCL communicator,
       both driving the same NVLink and NIC. Problems in red. 1 unit = 1pt -->
  <defs>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- what the job already had -->
  <text x="8" y="20" font-size="18" font-weight="bold" fill="#595959">Already in the job</text>
  <rect x="4" y="30" width="296" height="160" rx="6" fill="none" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="24" y="74" width="256" height="72" rx="5" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
  <text x="152" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">PyTorch's NCCL</text>
  <text x="152" y="129" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">communicator</text>

  <!-- what V1 added -->
  <text x="334" y="20" font-size="18" font-weight="bold" fill="#C00000">Added by DeepEP V1</text>
  <rect x="330" y="30" width="536" height="160" rx="6" fill="none" stroke="#C00000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="344" y="44" width="252" height="64" rx="5" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="470" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#C00000">CUDA IPC exchange</text>
  <text x="470" y="95" text-anchor="middle" font-size="17" fill="#222222">NVLink buffers</text>
  <rect x="604" y="44" width="248" height="64" rx="5" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="728" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#C00000">NVSHMEM bootstrap</text>
  <text x="728" y="95" text-anchor="middle" font-size="17" fill="#222222">own heap and QPs</text>
  <rect x="344" y="116" width="252" height="64" rx="5" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="470" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="#C00000">8 NVSHMEM knobs</text>
  <text x="470" y="167" text-anchor="middle" font-size="17" fill="#222222">set before init</text>
  <rect x="604" y="116" width="248" height="64" rx="5" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
  <text x="728" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="#C00000">Driver regkey</text>
  <text x="728" y="167" text-anchor="middle" font-size="17" fill="#222222">reboot or GDRCopy</text>

  <!-- shared hardware -->
  <rect x="4" y="214" width="862" height="44" rx="5" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
  <text x="435" y="242.3" text-anchor="middle" font-size="18" fill="#222222">the same NVLink and InfiniBand NIC per GPU</text>
  <line x1="152" y1="191" x2="152" y2="213" stroke="#333333" stroke-width="2.5" marker-end="url(#arrK)"/>
  <line x1="598" y1="191" x2="598" y2="213" stroke="#333333" stroke-width="2.5" marker-end="url(#arrK)"/>
</svg>

<text x="210.0" y="172.7" text-anchor="middle" font-size="17" fill="#222222" font-weight="normal" font-style="normal">2 bool masks of B × V</text>
<line x1="210.0" y1="186.0" x2="210.0" y2="214.0" stroke="#C00000" stroke-width="2.2" marker-end="url(#arrPrb)"/>

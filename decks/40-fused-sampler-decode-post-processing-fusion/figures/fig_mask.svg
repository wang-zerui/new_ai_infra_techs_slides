<text x="210.0" y="84.7" text-anchor="middle" font-size="17" fill="#222222" font-weight="normal" font-style="normal">prompt + output</text>
<line x1="210.0" y1="96.0" x2="210.0" y2="128.0" stroke="#C00000" stroke-width="2.2" marker-end="url(#arrPrb)"/>

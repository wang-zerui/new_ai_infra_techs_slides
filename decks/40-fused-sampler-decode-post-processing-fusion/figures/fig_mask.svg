<line x1="642.0" y1="208.0" x2="670.0" y2="208.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="665.0" y="266.0" text-anchor="middle" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">row = V / 8 = 15,104 bytes · no host copy</text>
</svg>

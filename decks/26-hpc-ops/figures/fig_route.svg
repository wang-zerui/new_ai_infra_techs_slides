  <text x="482.0" y="161.0" font-size="16" fill="#595959" text-anchor="middle">loaded once</text>
  <rect x="412.0" y="50.0" width="140.0" height="52.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="482.0" y="82.3" font-size="18" fill="#1F4E79" text-anchor="middle"></text>
  <text x="482.0" y="72.0" font-size="18" fill="#1F4E79" text-anchor="middle" font-weight="bold">BF16 MMA</text>
  <text x="482.0" y="93.0" font-size="17" fill="#1F4E79" text-anchor="middle">X·W<tspan font-size="12.2" dy="4.2">hi</tspan><tspan dy="-4.2"></tspan></text>
  <rect x="412.0" y="188.0" width="140.0" height="52.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="482.0" y="220.3" font-size="18" fill="#1F4E79" text-anchor="middle"></text>
  <text x="482.0" y="210.0" font-size="18" fill="#1F4E79" text-anchor="middle" font-weight="bold">BF16 MMA</text>
  <text x="482.0" y="231.0" font-size="17" fill="#1F4E79" text-anchor="middle">X·W<tspan font-size="12.2" dy="4.2">lo</tspan><tspan dy="-4.2"></tspan></text>
  <line x1="311.0" y1="76.0" x2="410.0" y2="76.0" stroke="#7F7F7F" stroke-width="2" marker-end="url(#a_neu)"/>
  <line x1="311.0" y1="214.0" x2="410.0" y2="214.0" stroke="#7F7F7F" stroke-width="2" marker-end="url(#a_neu)"/>
  <line x1="482.0" y1="118.0" x2="482.0" y2="104.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#a_acc)"/>
  <line x1="482.0" y1="170.0" x2="482.0" y2="186.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#a_acc)"/>
  <rect x="594.0" y="50.0" width="150.0" height="190.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="669.0" y="151.3" font-size="18" fill="#1F4E79" text-anchor="middle"></text>
  <text x="669.0" y="120.0" font-size="17" fill="#1F4E79" text-anchor="middle">FP32 registers</text>
  <text x="669.0" y="150.0" font-size="18" fill="#1F4E79" text-anchor="middle" font-weight="bold">acc<tspan font-size="13.0" dy="4.5">hi</tspan><tspan dy="-4.5"> +</tspan></text>
  <text x="669.0" y="176.0" font-size="18" fill="#1F4E79" text-anchor="middle" font-weight="bold">acc<tspan font-size="13.0" dy="4.5">lo</tspan><tspan dy="-4.5"> / 256</tspan></text>
  <line x1="553.0" y1="76.0" x2="592.0" y2="76.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#a_acc)"/>
  <line x1="553.0" y1="214.0" x2="592.0" y2="214.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#a_acc)"/>
  <line x1="745.0" y1="145.0" x2="766.0" y2="145.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#a_acc)"/>
  <rect x="768.0" y="119.0" width="92.0" height="52.0" rx="4" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="814.0" y="151.3" font-size="18" fill="#222222" text-anchor="middle"></text>
  <text x="814.0" y="141.0" font-size="18" fill="#222222" text-anchor="middle">FP32</text>
  <text x="814.0" y="162.0" font-size="18" fill="#222222" text-anchor="middle">scores</text>

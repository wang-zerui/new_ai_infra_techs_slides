<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="330pt" viewBox="0 0 870 330" font-family="Helvetica, Arial, sans-serif">
  <!-- fig_fuse: (a) AllReduce+residual+RMSNorm fused; (b) sampler chain to two kernels (slide figure, 1 unit = 1pt) -->
  <defs>
    <marker id="a_neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
    <marker id="a_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
    <marker id="a_prb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
    <marker id="a_acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
    <marker id="a_good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="1.6"/></pattern>
    <pattern id="hatchNeu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="1.6"/></pattern>
  </defs>
  <text x="6.0" y="18.0" font-size="19" fill="#222222" text-anchor="start" font-weight="bold">Tensor-parallel output (deck 13)</text>
  <rect x="6.0" y="44.0" width="104.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="58.0" y="70.3" font-size="18" fill="#222222" text-anchor="middle">AllReduce</text>
  <line x1="112.0" y1="64.0" x2="132.0" y2="64.0" stroke="#7F7F7F" stroke-width="2" marker-end="url(#a_neu)"/>
  <rect x="134.0" y="44.0" width="107.5" height="40.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="187.8" y="70.3" font-size="18" fill="#222222" text-anchor="middle">+ Residual</text>
  <line x1="243.5" y1="64.0" x2="263.5" y2="64.0" stroke="#7F7F7F" stroke-width="2" marker-end="url(#a_neu)"/>
  <rect x="265.5" y="44.0" width="106.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="318.5" y="70.3" font-size="18" fill="#222222" text-anchor="middle">RMSNorm</text>
  <path d="M6.0,86.0 L6.0,92.0 L371.5,92.0 L371.5,86.0" stroke="#C00000" stroke-width="2" fill="none"/>
  <text x="188.8" y="110.0" font-size="17" fill="#C00000" text-anchor="middle">3 stages with HBM round-trips</text>
  <path d="M400,55 L426,55 L426,46 L444,64 L426,82 L426,73 L400,73 z" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <rect x="452.0" y="30.0" width="414.0" height="96.0" rx="5" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="659.0" y="56.0" font-size="18" fill="#1F4E79" text-anchor="middle" font-weight="bold">One fused NVLink collective</text>
  <rect x="462.0" y="70.0" width="192.0" height="44.0" rx="4" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="558.0" y="98.3" font-size="18" fill="#222222" text-anchor="middle">CUDA multicast</text>
  <text x="558.0" y="98.0" font-size="17" fill="#222222" text-anchor="start"></text>
  <rect x="664.0" y="70.0" width="192.0" height="44.0" rx="4" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="760.0" y="98.3" font-size="18" fill="#222222" text-anchor="middle">Lamport P2P</text>
  <text x="558.0" y="144.0" font-size="17" fill="#595959" text-anchor="middle">large token counts</text>
  <text x="760.0" y="144.0" font-size="17" fill="#595959" text-anchor="middle">small decode batches</text>
  <line x1="6.0" y1="160.0" x2="864.0" y2="160.0" stroke="#BFBFBF" stroke-width="1.2"/>
  <text x="6.0" y="190.0" font-size="19" fill="#222222" text-anchor="start" font-weight="bold">Sampler (deck 40)</text>
  <rect x="6.0" y="202.0" width="82.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="47.0" y="228.3" font-size="18" fill="#222222" text-anchor="middle">Penalty</text>
  <line x1="90.0" y1="222.0" x2="110.0" y2="222.0" stroke="#7F7F7F" stroke-width="2" marker-end="url(#a_neu)"/>
  <rect x="112.0" y="202.0" width="73.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="148.5" y="228.3" font-size="18" fill="#222222" text-anchor="middle">Temp.</text>
  <line x1="187.0" y1="222.0" x2="207.0" y2="222.0" stroke="#7F7F7F" stroke-width="2" marker-end="url(#a_neu)"/>
  <rect x="209.0" y="202.0" width="68.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="243.0" y="228.3" font-size="18" fill="#222222" text-anchor="middle">Top-k</text>
  <line x1="279.0" y1="222.0" x2="299.0" y2="222.0" stroke="#7F7F7F" stroke-width="2" marker-end="url(#a_neu)"/>
  <rect x="301.0" y="202.0" width="69.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="335.5" y="228.3" font-size="18" fill="#222222" text-anchor="middle">Top-p</text>
  <rect x="6.0" y="254.0" width="88.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="50.0" y="280.3" font-size="18" fill="#222222" text-anchor="middle">Softmax</text>
  <line x1="96.0" y1="274.0" x2="116.0" y2="274.0" stroke="#7F7F7F" stroke-width="2" marker-end="url(#a_neu)"/>
  <rect x="118.0" y="254.0" width="83.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="159.5" y="280.3" font-size="18" fill="#222222" text-anchor="middle">Sample</text>
  <line x1="203.0" y1="274.0" x2="223.0" y2="274.0" stroke="#7F7F7F" stroke-width="2" marker-end="url(#a_neu)"/>
  <rect x="225.0" y="254.0" width="125.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="287.5" y="280.3" font-size="18" fill="#222222" text-anchor="middle">Mask update</text>
  <path d="M372.0,222.0 L384.0,222.0 L384.0,248 L48,248 L48,252" stroke="#7F7F7F" stroke-width="2" fill="none" marker-end="url(#a_neu)"/>
  <path d="M6.0,296.0 L6.0,302.0 L370.0,302.0 L370.0,296.0" stroke="#C00000" stroke-width="2" fill="none"/>
  <text x="188.0" y="320.0" font-size="17" fill="#C00000" text-anchor="middle">separate passes over the vocabulary</text>
  <path d="M400,239 L426,239 L426,230 L444,248 L426,266 L426,257 L400,257 z" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <rect x="452.0" y="202.0" width="414.0" height="40.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="659.0" y="228.3" font-size="18" fill="#1F4E79" text-anchor="middle">K1: one vocab pass to block top-k</text>
  <line x1="659.0" y1="243.0" x2="659.0" y2="257.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#a_acc)"/>
  <rect x="452.0" y="258.0" width="414.0" height="40.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="659.0" y="284.3" font-size="18" fill="#1F4E79" text-anchor="middle">K2: merge · top-p · sample · mask</text>
  <text x="452.0" y="320.0" font-size="17" fill="#1F4E79" text-anchor="start">penalty and temperature folded into K1</text>
</svg>

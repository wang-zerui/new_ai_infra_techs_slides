<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="250pt" viewBox="0 0 870 250" font-family="Helvetica, Arial, sans-serif">
  <!-- fig_moe: gather-then-GEMM kernel chain vs HPC-Ops fused FP8 MoE (timeline, not to scale) (slide figure, 1 unit = 1pt) -->
  <defs>
    <marker id="a_neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
    <marker id="a_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
    <marker id="a_prb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
    <marker id="a_acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
    <marker id="a_good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="1.6"/></pattern>
    <pattern id="hatchNeu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="1.6"/></pattern>
  </defs>
  <text x="6.0" y="18.0" font-size="19" fill="#222222" text-anchor="start" font-weight="bold">Gather-then-GEMM (separate kernels)</text>
  <rect x="6.0" y="28.0" width="72.0" height="48.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="42.0" y="58.3" font-size="18" fill="#222222" text-anchor="middle">Index</text>
  <rect x="81.0" y="38.0" width="14.0" height="28.0" rx="1" fill="url(#hatchPrb)" stroke="#C00000" stroke-width="1.2" />
  <rect x="98.0" y="28.0" width="86.0" height="48.0" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="2" />
  <text x="141.0" y="58.3" font-size="18" fill="#C00000" text-anchor="middle">Gather</text>
  <rect x="187.0" y="38.0" width="14.0" height="28.0" rx="1" fill="url(#hatchPrb)" stroke="#C00000" stroke-width="1.2" />
  <rect x="204.0" y="28.0" width="140.0" height="48.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="274.0" y="58.3" font-size="18" fill="#222222" text-anchor="middle">Gate-Up</text>
  <rect x="347.0" y="38.0" width="14.0" height="28.0" rx="1" fill="url(#hatchPrb)" stroke="#C00000" stroke-width="1.2" />
  <rect x="364.0" y="28.0" width="96.0" height="48.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="412.0" y="58.3" font-size="18" fill="#222222" text-anchor="middle">SiLU·mul</text>
  <rect x="463.0" y="38.0" width="14.0" height="28.0" rx="1" fill="url(#hatchPrb)" stroke="#C00000" stroke-width="1.2" />
  <rect x="480.0" y="28.0" width="72.0" height="48.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="516.0" y="58.3" font-size="18" fill="#222222" text-anchor="middle">Quant</text>
  <rect x="555.0" y="38.0" width="14.0" height="28.0" rx="1" fill="url(#hatchPrb)" stroke="#C00000" stroke-width="1.2" />
  <rect x="572.0" y="28.0" width="100.0" height="48.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="622.0" y="58.3" font-size="18" fill="#222222" text-anchor="middle">Down</text>
  <rect x="675.0" y="38.0" width="14.0" height="28.0" rx="1" fill="url(#hatchPrb)" stroke="#C00000" stroke-width="1.2" />
  <rect x="692.0" y="28.0" width="86.0" height="48.0" rx="4" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="735.0" y="58.3" font-size="18" fill="#222222" text-anchor="middle">Reduce</text>
  <text x="141.0" y="96.0" font-size="17" fill="#C00000" text-anchor="middle">extra HBM copy</text>
  <text x="516.0" y="96.0" font-size="17" fill="#C00000" text-anchor="middle">launch gaps</text>
  <line x1="516.0" y1="81.0" x2="470.0" y2="68.0" stroke="#C00000" stroke-width="1.5" marker-end="url(#a_prb)"/>
  <line x1="516.0" y1="81.0" x2="562.0" y2="68.0" stroke="#C00000" stroke-width="1.5" marker-end="url(#a_prb)"/>
  <text x="6.0" y="128.0" font-size="19" fill="#1F4E79" text-anchor="start" font-weight="bold">HPC-Ops fused FP8 MoE</text>
  <rect x="6.0" y="138.0" width="110.0" height="48.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="61.0" y="157.7" font-size="18" fill="#1F4E79" text-anchor="middle">Index</text>
  <text x="61.0" y="178.9" font-size="18" fill="#1F4E79" text-anchor="middle">in SMEM</text>
  <rect x="120.0" y="138.0" width="140.0" height="48.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="190.0" y="157.7" font-size="18" fill="#1F4E79" text-anchor="middle">Gate-Up</text>
  <text x="190.0" y="178.9" font-size="18" fill="#1F4E79" text-anchor="middle">via indices</text>
  <rect x="264.0" y="138.0" width="116.0" height="48.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="322.0" y="168.3" font-size="18" fill="#1F4E79" text-anchor="middle">Act + quant</text>
  <rect x="384.0" y="138.0" width="100.0" height="48.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="434.0" y="168.3" font-size="18" fill="#1F4E79" text-anchor="middle">Down</text>
  <rect x="488.0" y="138.0" width="86.0" height="48.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="531.0" y="168.3" font-size="18" fill="#1F4E79" text-anchor="middle">Reduce</text>
  <path d="M6.0,188.0 L6.0,194.0 L574.0,194.0 L574.0,188.0" stroke="#1F4E79" stroke-width="2" fill="none"/>
  <text x="290.0" y="212.0" font-size="17" fill="#1F4E79" text-anchor="middle">PDL-chained stages with no gather</text>
  <line x1="6.0" y1="238.0" x2="860.0" y2="238.0" stroke="#595959" stroke-width="1.8" marker-end="url(#a_neu)"/>
  <text x="856.0" y="232.0" font-size="17" fill="#595959" text-anchor="end">time</text>
</svg>

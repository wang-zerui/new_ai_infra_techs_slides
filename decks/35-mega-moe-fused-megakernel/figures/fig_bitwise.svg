<svg xmlns="http://www.w3.org/2000/svg" width="450pt" height="300pt" viewBox="0 0 450 300" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#BFBFBF" stroke-width="2"/>
  </pattern>
</defs>
<!-- bitwise check in the Mega MoE test -->
<rect x="60.0" y="6.0" width="330.0" height="52.0" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="2" />
<text x="225.0" y="27.7" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">same inputs</text>
<text x="225.0" y="47.7" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">x, top-k, weights</text>
<rect x="6.0" y="112.0" width="200.0" height="72.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="106.0" y="134.8" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">five kernels</text>
<text x="106.0" y="154.3" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">DeepEP + DeepGEMM</text>
<text x="106.0" y="172.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">+ TileLang</text>
<rect x="244.0" y="112.0" width="200.0" height="72.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="344.0" y="143.7" text-anchor="middle" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal">Mega MoE</text>
<text x="344.0" y="163.7" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">one kernel</text>
<line x1="150.0" y1="58.0" x2="106.0" y2="111.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="300.0" y1="58.0" x2="344.0" y2="111.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="106.0" y1="184.0" x2="170.0" y2="233.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="344.0" y1="184.0" x2="280.0" y2="233.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="60.0" y="234.0" width="330.0" height="60.0" rx="4" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2.4" />
<text x="225.0" y="258.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, Courier New, monospace">torch.equal(y, y_ref)</text>
<text x="225.0" y="283.0" text-anchor="middle" font-size="18" fill="#2E7D32" font-weight="bold" font-style="normal">bitwise identical</text>
</svg>

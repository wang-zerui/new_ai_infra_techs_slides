<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="268pt" viewBox="0 0 870 268" font-family="Helvetica, Arial, sans-serif">
  <!-- fig_overview: per decode step, assign kernel builds a task map reused by every layer's attention + combine (slide figure, 1 unit = 1pt) -->
  <defs>
    <marker id="a_neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
    <marker id="a_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
    <marker id="a_prb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
    <marker id="a_acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
    <marker id="a_good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="1.6"/></pattern>
    <pattern id="hatchNeu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="1.6"/></pattern>
  </defs>
  <rect x="4.0" y="140.0" width="118.0" height="56.0" rx="4" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="63.0" y="163.7" font-size="18" fill="#222222" text-anchor="middle">KV lengths</text>
  <text x="63.0" y="184.9" font-size="18" fill="#222222" text-anchor="middle">on GPU</text>
  <line x1="123.0" y1="168.0" x2="162.0" y2="168.0" stroke="#7F7F7F" stroke-width="2" marker-end="url(#a_neu)"/>
  <rect x="164.0" y="132.0" width="150.0" height="72.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="239.0" y="163.7" font-size="18" fill="#1F4E79" text-anchor="middle">Assign kernel</text>
  <text x="239.0" y="184.9" font-size="18" fill="#1F4E79" text-anchor="middle">once per step</text>
  <circle cx="164.0" cy="132.0" r="13" fill="#1F4E79"/>
  <text x="164.0" y="137.2" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
  <line x1="315.0" y1="168.0" x2="350.0" y2="168.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#a_acc)"/>
  <path d="M352,136 L470,136 L484,150 L484,200 L352,200 z" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <path d="M470,136 L470,150 L484,150" fill="none" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="418.0" y="164.0" font-size="18" fill="#1F4E79" text-anchor="middle" font-weight="bold">Task map</text>
  <text x="418.0" y="186.0" font-size="17" fill="#222222" text-anchor="middle">per-CTA bins</text>
  <rect x="516.0" y="22.0" width="350.0" height="242.0" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.8" stroke-dasharray="6,4" />
  <text x="528.0" y="48.0" font-size="18" fill="#1F4E79" text-anchor="start" font-weight="bold">Every layer reuses the map</text>
  <line x1="485.0" y1="168.0" x2="532.0" y2="168.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#a_acc)"/>
  <rect x="534.0" y="132.0" width="154.0" height="72.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="611.0" y="163.7" font-size="18" fill="#1F4E79" text-anchor="middle">Attention</text>
  <text x="611.0" y="184.9" font-size="18" fill="#1F4E79" text-anchor="middle">persistent CTAs</text>
  <circle cx="534.0" cy="132.0" r="13" fill="#1F4E79"/>
  <text x="534.0" y="137.2" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
  <rect x="534.0" y="64.0" width="154.0" height="38.0" rx="4" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="611.0" y="89.3" font-size="18" fill="#222222" text-anchor="middle">Q · paged KV</text>
  <line x1="611.0" y1="103.0" x2="611.0" y2="130.0" stroke="#7F7F7F" stroke-width="2" marker-end="url(#a_neu)"/>
  <rect x="746.0" y="132.0" width="112.0" height="72.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="802.0" y="163.7" font-size="18" fill="#1F4E79" text-anchor="middle">Combine</text>
  <text x="802.0" y="184.9" font-size="18" fill="#1F4E79" text-anchor="middle">LSE merge</text>
  <circle cx="746.0" cy="132.0" r="13" fill="#1F4E79"/>
  <text x="746.0" y="137.2" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
  <line x1="689.0" y1="168.0" x2="744.0" y2="168.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#a_acc)"/>
  <text x="538.0" y="230.0" font-size="17" fill="#1F4E79" text-anchor="start">writes partial O</text>
  <text x="538.0" y="252.0" font-size="17" fill="#1F4E79" text-anchor="start">and LSE per task</text>
  <line x1="802.0" y1="205.0" x2="802.0" y2="222.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#a_acc)"/>
  <rect x="746.0" y="224.0" width="112.0" height="36.0" rx="4" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="802.0" y="248.3" font-size="18" fill="#222222" text-anchor="middle">Output O</text>
</svg>

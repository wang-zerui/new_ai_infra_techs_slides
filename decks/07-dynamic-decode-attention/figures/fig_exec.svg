<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="292pt" viewBox="0 0 870 292" font-family="Helvetica, Arial, sans-serif">
  <!-- fig_exec: persistent CTA drains its bin (load warp + math warpgroup), combine merges chunks by LSE (slide figure, 1 unit = 1pt) -->
  <defs>
    <marker id="a_neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
    <marker id="a_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
    <marker id="a_prb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
    <marker id="a_acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
    <marker id="a_good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="1.6"/></pattern>
    <pattern id="hatchNeu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="1.6"/></pattern>
  </defs>
  <rect x="4.0" y="30.0" width="516.0" height="258.0" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.8" stroke-dasharray="6,4" />
  <text x="16.0" y="22.0" font-size="19" fill="#1F4E79" text-anchor="start" font-weight="bold">Persistent CTA, 4 per SM</text>
  <rect x="16.0" y="52.0" width="150.0" height="44.0" rx="4" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="91.0" y="80.3" font-size="18" fill="#222222" text-anchor="middle">Paged KV · Q</text>
  <line x1="91.0" y1="97.0" x2="91.0" y2="118.0" stroke="#7F7F7F" stroke-width="2" marker-end="url(#a_neu)"/>
  <rect x="16.0" y="120.0" width="150.0" height="66.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="91.0" y="148.7" font-size="18" fill="#1F4E79" text-anchor="middle">Load warp</text>
  <text x="91.0" y="169.9" font-size="18" fill="#1F4E79" text-anchor="middle">TMA per page</text>
  <line x1="167.0" y1="153.0" x2="196.0" y2="153.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#a_acc)"/>
  <rect x="198.0" y="120.0" width="112.0" height="66.0" rx="4" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="254.0" y="148.7" font-size="18" fill="#222222" text-anchor="middle">SMEM</text>
  <text x="254.0" y="169.9" font-size="18" fill="#222222" text-anchor="middle">2 stages</text>
  <line x1="311.0" y1="153.0" x2="340.0" y2="153.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#a_acc)"/>
  <rect x="342.0" y="120.0" width="164.0" height="66.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
  <text x="424.0" y="148.7" font-size="18" fill="#1F4E79" text-anchor="middle">Math warpgroup</text>
  <text x="424.0" y="169.9" font-size="18" fill="#1F4E79" text-anchor="middle">wgmma 64 × 8</text>
  <text x="410.0" y="214.0" font-size="17" fill="#222222" text-anchor="middle"><tspan font-size="17.0" dy="0.0">S = K·Q</tspan><tspan font-size="12.2" dy="-5.9">T</tspan><tspan font-size="17.0" dy="5.9"> · softmax · P·V</tspan></text>
  <text x="410.0" y="238.0" font-size="17" fill="#595959" text-anchor="middle">64 KV tokens × 8 heads</text>
  <path d="M424,250 L424,270 L91,270 L91,188" stroke="#1F4E79" stroke-width="2" fill="none" marker-end="url(#a_acc)"/>
  <text x="250.0" y="262.0" font-size="17" fill="#1F4E79" text-anchor="middle">next task in the bin</text>
  <text x="556.0" y="22.0" font-size="19" fill="#222222" text-anchor="start" font-weight="bold">Combine, per request and head</text>
  <rect x="556.0" y="52.0" width="150.0" height="50.0" rx="4" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="631.0" y="83.3" font-size="18" fill="#222222" text-anchor="middle"></text>
  <text x="631.0" y="75.0" font-size="18" fill="#222222" text-anchor="middle"><tspan font-size="18.0" dy="0.0">O</tspan><tspan font-size="13.0" dy="4.5">0</tspan><tspan font-size="18.0" dy="-4.5">, lse</tspan><tspan font-size="13.0" dy="4.5">0</tspan></text>
  <text x="631" y="95" font-size="15" fill="#595959" text-anchor="middle">from CTA 0</text>
  <rect x="556.0" y="120.0" width="150.0" height="50.0" rx="4" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="631.0" y="151.3" font-size="18" fill="#222222" text-anchor="middle"></text>
  <text x="631.0" y="143.0" font-size="18" fill="#222222" text-anchor="middle"><tspan font-size="18.0" dy="0.0">O</tspan><tspan font-size="13.0" dy="4.5">1</tspan><tspan font-size="18.0" dy="-4.5">, lse</tspan><tspan font-size="13.0" dy="4.5">1</tspan></text>
  <text x="631" y="163" font-size="15" fill="#595959" text-anchor="middle">from CTA 1</text>
  <circle cx="760" cy="111" r="20" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2"/>
  <text x="760.0" y="119.0" font-size="24" fill="#1F4E79" text-anchor="middle" font-weight="bold">+</text>
  <line x1="707.0" y1="77.0" x2="741.0" y2="104.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#a_acc)"/>
  <line x1="707.0" y1="145.0" x2="741.0" y2="118.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#a_acc)"/>
  <line x1="781.0" y1="111.0" x2="806.0" y2="111.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#a_acc)"/>
  <rect x="808.0" y="89.0" width="58.0" height="44.0" rx="4" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.5" />
  <text x="837.0" y="117.3" font-size="18" fill="#222222" text-anchor="middle">O</text>
  <text x="556.0" y="212.0" font-size="18" fill="#222222" text-anchor="start"><tspan font-size="18.0" dy="0.0">w</tspan><tspan font-size="13.0" dy="4.5">c</tspan><tspan font-size="18.0" dy="-4.5"> = exp(lse</tspan><tspan font-size="13.0" dy="4.5">c</tspan><tspan font-size="18.0" dy="-4.5"> − max lse)</tspan></text>
  <text x="556.0" y="240.0" font-size="18" fill="#222222" text-anchor="start"><tspan font-size="18.0" dy="0.0">O = Σ w</tspan><tspan font-size="13.0" dy="4.5">c</tspan><tspan font-size="18.0" dy="-4.5"> O</tspan><tspan font-size="13.0" dy="4.5">c</tspan><tspan font-size="18.0" dy="-4.5"> / Σ w</tspan><tspan font-size="13.0" dy="4.5">c</tspan></text>
  <text x="556.0" y="268.0" font-size="17" fill="#1F4E79" text-anchor="start">chunk counts read from the task map</text>
  <line x1="507.0" y1="153.0" x2="554.0" y2="145.0" stroke="#7F7F7F" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#a_neu)"/>
</svg>

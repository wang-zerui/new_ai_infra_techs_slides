<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="296pt" viewBox="0 0 870 296" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- optimizer state offload vs CPU optimizer -->
<text x="198.0" y="66.0" text-anchor="end" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal">state offload</text>
<text x="198.0" y="88.0" text-anchor="end" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">step on GPU</text>
<text x="198.0" y="196.0" text-anchor="end" font-size="18" fill="#222222" font-weight="bold" font-style="normal">CPU optimizer</text>
<text x="198.0" y="218.0" text-anchor="end" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">step on host</text>
<rect x="210.0" y="40.0" width="330.0" height="40.0" rx="2" fill="#FFFFFF" stroke="#595959" stroke-width="1.6" />
<text x="375.0" y="65.6" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">forward + backward of all micro-batches</text>
<rect x="660.0" y="40.0" width="90.0" height="40.0" rx="2" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.8" />
<text x="705.0" y="66.0" text-anchor="middle" font-size="17" fill="#1F4E79" font-weight="bold" font-style="normal">step</text>
<rect x="550.0" y="88.0" width="104.0" height="34.0" rx="2" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.8" />
<text x="602.0" y="110.6" text-anchor="middle" font-size="16" fill="#1F4E79" font-weight="normal" font-style="normal">reload</text>
<rect x="756.0" y="88.0" width="104.0" height="34.0" rx="2" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.8" />
<text x="808.0" y="110.6" text-anchor="middle" font-size="16" fill="#1F4E79" font-weight="normal" font-style="normal">offload</text>
<text x="375.0" y="106.0" text-anchor="middle" font-size="16" fill="#1F4E79" font-weight="normal" font-style="italic">HBM free of state</text>
<line x1="656.0" y1="105.0" x2="704.0" y2="82.0" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#arrAcc)"/>
<line x1="750.0" y1="70.0" x2="806.0" y2="86.0" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#arrAcc)"/>
<line x1="8.0" y1="146.0" x2="862.0" y2="146.0" stroke="#D9D9D9" stroke-width="1.2"/>
<rect x="210.0" y="170.0" width="330.0" height="40.0" rx="2" fill="#FFFFFF" stroke="#595959" stroke-width="1.6" />
<text x="375.0" y="195.6" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">forward + backward of all micro-batches</text>
<rect x="550.0" y="218.0" width="104.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#595959" stroke-width="1.6" />
<text x="602.0" y="240.6" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">grads D2H</text>
<rect x="660.0" y="218.0" width="90.0" height="34.0" rx="2" fill="#FFF2CC" stroke="#BF9000" stroke-width="1.6" />
<text x="705.0" y="240.9" text-anchor="middle" font-size="17" fill="#222222" font-weight="normal" font-style="normal">step</text>
<rect x="756.0" y="218.0" width="104.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#595959" stroke-width="1.6" />
<text x="808.0" y="240.6" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">params H2D</text>
<text x="375.0" y="236.0" text-anchor="middle" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">host CPU does the math</text>
<rect x="210.0" y="268.0" width="40.0" height="22.0" rx="4" fill="#FFF2CC" stroke="#BF9000" stroke-width="1.8" />
<text x="230.0" y="283.9" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal" font-style="normal"></text>
<text x="258.0" y="285.0" text-anchor="start" font-size="16" fill="#222222" font-weight="normal" font-style="normal">host side</text>
<text x="370.0" y="285.0" text-anchor="start" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">state = exp_avg + exp_avg_sq + FP32 master weights</text>
</svg>

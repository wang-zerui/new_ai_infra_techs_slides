<svg xmlns="http://www.w3.org/2000/svg" width="480pt" height="336pt" viewBox="0 0 480 336" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- fig_tp_layer: TP layer boundary -->
<rect x="34.0" y="5.0" width="290.0" height="56.0" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.6" />
<rect x="29.0" y="10.0" width="290.0" height="56.0" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.6" />
<rect x="24.0" y="15.0" width="290.0" height="56.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="169.0" y="38.9" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">row-parallel GEMM</text>
<text x="169.0" y="59.6" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">on GPU 0 … 7</text>
<line x1="169.0" y1="73.0" x2="169.0" y2="104.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="179.0" y="95.0" text-anchor="start" font-size="17" fill="#222222" font-weight="normal" font-style="normal">partial sums</text>
<rect x="14.0" y="110.0" width="310.0" height="178.0" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2" stroke-dasharray="7,4" />
<text x="22.0" y="128.0" text-anchor="start" font-size="16" fill="#1F4E79" font-weight="bold" font-style="normal">TP layer boundary</text>
<rect x="44.0" y="136.0" width="250.0" height="40.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="169.0" y="162.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">AllReduce over 8 GPUs</text>
<line x1="169.0" y1="177.0" x2="169.0" y2="186.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="44.0" y="188.0" width="250.0" height="40.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="169.0" y="214.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">+ residual</text>
<line x1="169.0" y1="229.0" x2="169.0" y2="238.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="44.0" y="240.0" width="250.0" height="40.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="169.0" y="266.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">RMSNorm</text>
<line x1="169.0" y1="289.0" x2="169.0" y2="300.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="24.0" y="302.0" width="290.0" height="30.0" rx="4" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="2" stroke-dasharray="6,4" />
<text x="169.0" y="322.9" text-anchor="middle" font-size="17" fill="#7F7F7F" font-weight="normal" font-style="normal">next block</text>
<text x="336.0" y="186.0" text-anchor="start" font-size="18" fill="#222222" font-weight="bold" font-style="normal">twice per layer</text>
<text x="336.0" y="210.0" text-anchor="start" font-size="17" fill="#222222" font-weight="normal" font-style="normal">after attention</text>
<text x="336.0" y="232.0" text-anchor="start" font-size="17" fill="#222222" font-weight="normal" font-style="normal">after the MLP</text>
</svg>

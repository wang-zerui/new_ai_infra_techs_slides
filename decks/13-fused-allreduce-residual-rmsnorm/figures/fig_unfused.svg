<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="290pt" viewBox="0 0 870 290" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- fig_unfused: NCCL AllReduce then fused_add_rmsnorm, one GPU's view -->
<text x="118.0" y="75.3" text-anchor="end" font-size="18" fill="#222222" font-weight="bold" font-style="normal">GPU SMs</text>
<text x="118.0" y="215.3" text-anchor="end" font-size="18" fill="#222222" font-weight="bold" font-style="normal">HBM</text>
<rect x="130.0" y="46.0" width="250.0" height="46.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="255.0" y="75.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">NCCL AllReduce</text>
<rect x="380.0" y="46.0" width="56.0" height="46.0" rx="3" fill="url(#hatchPrb)" stroke="#C00000" stroke-width="2" />
<text x="408.0" y="36.0" text-anchor="middle" font-size="16" fill="#C00000" font-weight="bold" font-style="normal">kernel boundary</text>
<rect x="436.0" y="46.0" width="410.0" height="46.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="641.0" y="75.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">fused_add_rmsnorm on all N tokens</text>
<rect x="130.0" y="186.0" width="120.0" height="46.0" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="2" />
<text x="190.0" y="215.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">x partial</text>
<rect x="300.0" y="186.0" width="170.0" height="46.0" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="2" />
<text x="385.0" y="215.3" text-anchor="middle" font-size="18" fill="#C00000" font-weight="bold" font-style="normal">x reduced</text>
<rect x="520.0" y="186.0" width="130.0" height="46.0" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="2" />
<text x="585.0" y="215.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">residual</text>
<rect x="700.0" y="186.0" width="146.0" height="46.0" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="2" />
<text x="773.0" y="215.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">output</text>
<line x1="190.0" y1="184.0" x2="190.0" y2="95.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="345.0" y1="94.0" x2="345.0" y2="184.0" stroke="#C00000" stroke-width="2.6" marker-end="url(#arrPrb)"/>
<line x1="455.0" y1="184.0" x2="455.0" y2="95.0" stroke="#C00000" stroke-width="2.6" marker-end="url(#arrPrb)"/>
<line x1="570.0" y1="184.0" x2="570.0" y2="95.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="600.0" y1="94.0" x2="600.0" y2="184.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="773.0" y1="94.0" x2="773.0" y2="184.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="400.0" y="262.0" text-anchor="middle" font-size="17" fill="#C00000" font-weight="bold" font-style="normal">HBM round trip</text>
<line x1="118.0" y1="268.0" x2="846.0" y2="268.0" stroke="#222222" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="846.0" y="286.0" text-anchor="end" font-size="16" fill="#222222" font-weight="normal" font-style="normal">time</text>
<text x="130.0" y="286.0" text-anchor="start" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">same on all eight GPUs</text>
</svg>

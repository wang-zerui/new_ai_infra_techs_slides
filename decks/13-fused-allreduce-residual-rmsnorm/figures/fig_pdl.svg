<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="292pt" viewBox="0 0 870 292" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- fig_pdl: plain stream order vs PDL launch of the RMSNorm kernel (schematic) -->
<text x="158.0" y="58.0" text-anchor="end" font-size="18" fill="#222222" font-weight="bold" font-style="normal">stream order</text>
<rect x="170.0" y="34.0" width="300.0" height="42.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="320.0" y="61.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="normal" font-style="normal">kernel 1: all-reduce</text>
<rect x="470.0" y="34.0" width="60.0" height="42.0" rx="3" fill="url(#hatchPrb)" stroke="#C00000" stroke-width="2" />
<text x="500.0" y="26.0" text-anchor="middle" font-size="16" fill="#C00000" font-weight="bold" font-style="normal">launch</text>
<rect x="530.0" y="34.0" width="130.0" height="42.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="595.0" y="61.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="normal" font-style="normal">prologue</text>
<rect x="660.0" y="34.0" width="200.0" height="42.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="760.0" y="61.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="normal" font-style="normal">+ res · RMSNorm</text>
<line x1="860.0" y1="22.0" x2="860.0" y2="236.0" stroke="#7F7F7F" stroke-width="1.6" stroke-dasharray="5,5"/>
<text x="158.0" y="136.0" text-anchor="end" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal">with PDL</text>
<text x="158.0" y="156.0" text-anchor="end" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">kernel 1</text>
<rect x="170.0" y="116.0" width="300.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="320.0" y="141.9" text-anchor="middle" font-size="17" fill="#222222" font-weight="normal" font-style="normal">kernel 1: all-reduce</text>
<text x="158.0" y="196.0" text-anchor="end" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">kernel 2</text>
<rect x="194.0" y="172.0" width="170.0" height="40.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="279.0" y="197.9" text-anchor="middle" font-size="17" fill="#222222" font-weight="normal" font-style="normal">prefetch res γ</text>
<rect x="364.0" y="172.0" width="106.0" height="40.0" rx="3" fill="url(#hatchGray)" stroke="#7F7F7F" stroke-width="2" />
<text x="417.0" y="198.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="normal" font-style="normal" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">poll</text>
<rect x="470.0" y="172.0" width="200.0" height="40.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="570.0" y="197.9" text-anchor="middle" font-size="17" fill="#222222" font-weight="normal" font-style="normal">+ res · RMSNorm</text>
<line x1="194.0" y1="158.0" x2="194.0" y2="170.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#arrAcc)"/>
<text x="200.0" y="108.0" text-anchor="start" font-size="15" fill="#1F4E79" font-weight="normal" font-style="italic">early trigger</text>
<line x1="670.0" y1="222.0" x2="860.0" y2="222.0" stroke="#1F4E79" stroke-width="2.4" marker-end="url(#arrAcc)" marker-start="url(#arrAcc)"/>
<text x="765.0" y="246.0" text-anchor="middle" font-size="17" fill="#1F4E79" font-weight="bold" font-style="normal">time saved</text>
<line x1="162.0" y1="266.0" x2="862.0" y2="266.0" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="862.0" y="286.0" text-anchor="end" font-size="16" fill="#222222" font-weight="normal" font-style="normal">time</text>
</svg>

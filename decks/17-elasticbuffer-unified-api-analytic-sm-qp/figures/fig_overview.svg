<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="252pt"
     viewBox="0 0 870 252" font-family="Helvetica, Arial, sans-serif">
  <!-- fig_overview: deck 17 overview. Top lane = the unified EPBuffer API (1); bottom lane = the analytic SM (2)
       and QP (3) budget feeding every kernel launch. 1 unit = 1pt -->
  <defs>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
  </defs>

  <text x="4" y="20" font-size="18" font-weight="bold" fill="#595959">API</text>
  <text x="4" y="148" font-size="18" font-weight="bold" fill="#595959">Budget</text>

  <!-- top lane -->
  <rect x="4" y="30" width="150" height="60" rx="5" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
  <text x="79" y="66.3" text-anchor="middle" font-size="18" fill="#222222">MoE layer</text>
  <rect x="200" y="30" width="220" height="60" rx="5" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="310" y="55" text-anchor="middle" font-size="18" font-weight="bold" font-family="Menlo, 'Courier New', monospace" fill="#1F4E79">EPBuffer</text>
  <text x="310" y="79" text-anchor="middle" font-size="17" fill="#222222">dispatch · combine</text>
  <rect x="466" y="30" width="210" height="60" rx="5" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="571" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F4E79">hybrid or direct</text>
  <text x="571" y="79" text-anchor="middle" font-size="17" fill="#222222">kernel launch</text>
  <rect x="720" y="30" width="146" height="60" rx="5" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
  <text x="793" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">NVLink + Gin</text>
  <text x="793" y="79" text-anchor="middle" font-size="17" fill="#222222">transport</text>
  <line x1="155" y1="60" x2="199" y2="60" stroke="#333333" stroke-width="2.5" marker-end="url(#arrK)"/>
  <line x1="421" y1="60" x2="465" y2="60" stroke="#333333" stroke-width="2.5" marker-end="url(#arrK)"/>
  <line x1="677" y1="60" x2="719" y2="60" stroke="#333333" stroke-width="2.5" marker-end="url(#arrK)"/>

  <!-- bottom lane -->
  <rect x="4" y="160" width="150" height="86" rx="5" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
  <text x="79" y="185" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">MoE config</text>
  <text x="79" y="209" text-anchor="middle" font-size="16" fill="#222222">top-k · EP shape</text>
  <text x="79" y="232" text-anchor="middle" font-size="16" fill="#222222">link GB/s</text>
  <rect x="200" y="160" width="220" height="86" rx="5" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="310" y="185" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F4E79">SM model</text>
  <text x="310" y="209" text-anchor="middle" font-size="17" fill="#222222">bottleneck link</text>
  <text x="310" y="232" text-anchor="middle" font-size="17" fill="#222222">→ SMs to feed it</text>
  <rect x="466" y="160" width="210" height="86" rx="5" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="571" y="185" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F4E79">QP model</text>
  <text x="571" y="209" text-anchor="middle" font-size="17" fill="#222222">direct: at most 9</text>
  <text x="571" y="232" text-anchor="middle" font-size="17" fill="#222222">hybrid: per channel</text>
  <line x1="155" y1="203" x2="199" y2="203" stroke="#333333" stroke-width="2.5" marker-end="url(#arrK)"/>
  <line x1="421" y1="203" x2="465" y2="203" stroke="#1F4E79" stroke-width="2.5" marker-end="url(#arrA)"/>
  <line x1="571" y1="159" x2="571" y2="91" stroke="#1F4E79" stroke-width="2.5" marker-end="url(#arrA)"/>
  <text x="584" y="131" font-size="16" font-family="Menlo, 'Courier New', monospace" fill="#1F4E79">num_sms · num_qps</text>

  <!-- step badges -->
  <circle cx="200" cy="30" r="12" fill="#222222"/>
  <text x="200" y="35.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">1</text>
  <circle cx="200" cy="160" r="12" fill="#222222"/>
  <text x="200" y="165.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">2</text>
  <circle cx="466" cy="160" r="12" fill="#222222"/>
  <text x="466" y="165.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">3</text>
</svg>

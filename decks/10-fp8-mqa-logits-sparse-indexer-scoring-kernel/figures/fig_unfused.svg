<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="268pt" viewBox="0 0 870 268" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- unfused vs fused indexer -->
<text x="0.0" y="20.0" text-anchor="start" font-size="19" fill="#222222" font-weight="bold" font-style="normal">(a) GEMM + elementwise kernel</text>
<rect x="0.0" y="52.0" width="150.0" height="64.0" rx="6" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="75.0" y="80.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">GEMM</text>
<text x="75.0" y="102.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">q · kᵀ per head</text>
<rect x="208.0" y="30.0" width="250.0" height="92.0" rx="4" fill="#FFFFFF" stroke="#C00000" stroke-width="2.2" />
<rect x="202.0" y="36.0" width="250.0" height="92.0" rx="4" fill="#FFFFFF" stroke="#C00000" stroke-width="2.2" />
<rect x="196.0" y="42.0" width="250.0" height="92.0" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="2.2" />
<text x="321.0" y="74.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">per-head scores in HBM</text>
<text x="321.0" y="98.0" text-anchor="middle" font-size="17" fill="#C00000" font-weight="bold" font-style="normal">n_q × 64 × n_kv · FP32</text>
<line x1="152.0" y1="84.0" x2="193.0" y2="84.0" stroke="#C00000" stroke-width="2.4" marker-end="url(#arrPrb)"/>
<rect x="500.0" y="52.0" width="170.0" height="64.0" rx="6" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="585.0" y="80.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">ReLU · w · Σ</text>
<text x="585.0" y="102.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">2nd kernel</text>
<line x1="460.0" y1="84.0" x2="497.0" y2="84.0" stroke="#C00000" stroke-width="2.4" marker-end="url(#arrPrb)"/>
<text x="478.0" y="72.0" text-anchor="middle" font-size="15" fill="#C00000" font-weight="bold" font-style="normal">read</text>
<text x="173.0" y="72.0" text-anchor="middle" font-size="15" fill="#C00000" font-weight="bold" font-style="normal">write</text>
<rect x="716.0" y="60.0" width="150.0" height="48.0" rx="6" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="791.0" y="80.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">logits</text>
<text x="791.0" y="102.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">n_q × n_kv</text>
<line x1="672.0" y1="84.0" x2="713.0" y2="84.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="0.0" y1="152.0" x2="870.0" y2="152.0" stroke="#BFBFBF" stroke-width="1.2"/>
<text x="0.0" y="180.0" text-anchor="start" font-size="19" fill="#222222" font-weight="bold" font-style="normal">(b) one fused kernel (DeepGEMM)</text>
<rect x="0.0" y="196.0" width="670.0" height="64.0" rx="6" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.6" />
<text x="335.0" y="222.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">MMA  →  ReLU · w  →  Σ heads  →  × key scale</text>
<text x="335.0" y="246.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">all in registers / shared memory</text>
<rect x="716.0" y="204.0" width="150.0" height="48.0" rx="6" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.4" />
<text x="791.0" y="224.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">logits</text>
<text x="791.0" y="246.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">n_q × span</text>
<line x1="672.0" y1="228.0" x2="713.0" y2="228.0" stroke="#1F4E79" stroke-width="2.4" marker-end="url(#arrAcc)"/>
</svg>

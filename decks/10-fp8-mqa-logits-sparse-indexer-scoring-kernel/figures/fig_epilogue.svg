<text x="483.0" y="227.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">2 heads / instr</text>
<rect x="584.0" y="180.0" width="136.0" height="58.0" rx="6" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.2" />
<text x="652.0" y="206.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal" font-family="Menlo, Courier New, monospace">hadd2</text>
<text x="652.0" y="227.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">reduce pairs</text>
<rect x="746.0" y="180.0" width="122.0" height="58.0" rx="6" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.2" />
<text x="807.0" y="206.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal">store BF16</text>
<text x="807.0" y="227.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">if in span</text>

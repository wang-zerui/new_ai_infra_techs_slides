<line x1="748.0" y1="62.0" x2="770.0" y2="62.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="150.0" y1="100.0" x2="368.0" y2="100.0" stroke="#C00000" stroke-width="2"/>
<text x="259.0" y="120.0" text-anchor="middle" font-size="16" fill="#C00000" font-weight="bold" font-style="normal">64 × per (token, key)</text>
<text x="698.0" y="120.0" text-anchor="middle" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">ReLU(s·x) = s·ReLU(x), s &gt; 0</text>
<line x1="0.0" y1="146.0" x2="870.0" y2="146.0" stroke="#BFBFBF" stroke-width="1.2"/>
<text x="0.0" y="166.0" text-anchor="start" font-size="18" fill="#222222" font-weight="bold" font-style="normal">(b) Blackwell (SM100): TMEM, packed BF16</text>
<rect x="0.0" y="180.0" width="120.0" height="58.0" rx="6" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.2" />
<text x="60.0" y="206.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal">TMEM</text>
<text x="60.0" y="227.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">→ registers</text>
<rect x="150.0" y="180.0" width="232.0" height="58.0" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="2.2" />
<text x="266.0" y="206.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal" font-family="Menlo, Courier New, monospace">cvt.rn.relu.bf16x2</text>
<text x="266.0" y="227.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">ReLU rides on the convert</text>
<rect x="408.0" y="180.0" width="150.0" height="58.0" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="2.2" />

<!-- fused epilogue -->
<text x="0.0" y="18.0" text-anchor="start" font-size="18" fill="#222222" font-weight="bold" font-style="normal">(a) Hopper (SM90): FP32 registers</text>
<rect x="0.0" y="34.0" width="120.0" height="56.0" rx="6" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.2" />
<text x="60.0" y="59.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal">64 scores</text>
<text x="60.0" y="80.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">per head</text>
<rect x="150.0" y="34.0" width="96.0" height="56.0" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="2.2" />
<text x="198.0" y="59.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal">ReLU</text>
<text x="198.0" y="80.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">fmaxf</text>
<rect x="272.0" y="34.0" width="96.0" height="56.0" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="2.2" />
<text x="320.0" y="59.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal">× w_h</text>
<text x="320.0" y="80.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">per head</text>
<rect x="394.0" y="34.0" width="104.0" height="56.0" rx="6" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.2" />
<text x="446.0" y="59.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal">Σ heads</text>
<text x="446.0" y="80.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">in thread</text>
<rect x="524.0" y="34.0" width="100.0" height="56.0" rx="6" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.2" />
<text x="574.0" y="59.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal">shuffle ×2</text>
<text x="574.0" y="80.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">4 lanes</text>
<rect x="650.0" y="34.0" width="96.0" height="56.0" rx="6" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.2" />
<text x="698.0" y="59.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal">× s_k</text>
<text x="698.0" y="80.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="normal" font-style="normal">once</text>
<rect x="772.0" y="34.0" width="96.0" height="56.0" rx="6" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.2" />

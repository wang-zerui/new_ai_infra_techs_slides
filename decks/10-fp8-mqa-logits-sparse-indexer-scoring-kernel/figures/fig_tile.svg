<text x="326.0" y="156.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">FP32 accumulators</text>
<text x="326.0" y="178.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">256 × 128 (token, head)</text>
<text x="326.0" y="272.0" text-anchor="middle" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="normal">registers (SM90) · TMEM (SM100)</text>
<line x1="460.0" y1="162.0" x2="562.0" y2="162.0" stroke="#1F4E79" stroke-width="2.6" marker-end="url(#arrAcc)"/>
<text x="510.0" y="126.0" text-anchor="middle" font-size="17" fill="#1F4E79" font-weight="bold" font-style="normal">ReLU · w</text>
<text x="510.0" y="148.0" text-anchor="middle" font-size="17" fill="#1F4E79" font-weight="bold" font-style="normal">Σ 64 heads</text>
<rect x="568.0" y="70.0" width="34.0" height="184.0" rx="2" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="585.0" y="62.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold" font-style="normal">t</text>
<rect x="602.0" y="70.0" width="34.0" height="184.0" rx="2" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="619.0" y="62.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold" font-style="normal">t+1</text>
<text x="602.0" y="272.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">256 × 2 logits</text>
<text x="664.0" y="100.0" text-anchor="start" font-size="17" fill="#222222" font-weight="bold" font-style="normal">M = keys</text>
<text x="664.0" y="122.0" text-anchor="start" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="normal">64 per warpgroup</text>
<text x="664.0" y="162.0" text-anchor="start" font-size="17" fill="#222222" font-weight="bold" font-style="normal">N = token × head</text>
<text x="664.0" y="184.0" text-anchor="start" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="normal">128 = (128 / H) × H</text>
<text x="664.0" y="224.0" text-anchor="start" font-size="17" fill="#222222" font-weight="bold" font-style="normal">one key read</text>
<text x="664.0" y="246.0" text-anchor="start" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="normal">feeds 128 scores</text>

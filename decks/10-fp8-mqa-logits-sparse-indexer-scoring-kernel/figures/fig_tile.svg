<rect x="196.0" y="116.0" width="130.0" height="46.0" rx="0" fill="#F4F8FC" stroke="#9DB7D5" stroke-width="1.2" />
<rect x="326.0" y="116.0" width="130.0" height="46.0" rx="0" fill="#F4F8FC" stroke="#9DB7D5" stroke-width="1.2" />
<rect x="196.0" y="162.0" width="130.0" height="46.0" rx="0" fill="#F4F8FC" stroke="#9DB7D5" stroke-width="1.2" />

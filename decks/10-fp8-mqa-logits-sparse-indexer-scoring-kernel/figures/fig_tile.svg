<text x="88.0" y="145.0" text-anchor="end" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="normal">64–127</text>
<rect x="96.0" y="162.0" width="64.0" height="46.0" rx="2" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="128.0" y="191.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold" font-style="normal">WG2</text>
<text x="88.0" y="191.0" text-anchor="end" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="normal">128–191</text>
<rect x="96.0" y="208.0" width="64.0" height="46.0" rx="2" fill="#C9DDF0" stroke="#1F4E79" stroke-width="2" />
<text x="128.0" y="237.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold" font-style="normal">WG3</text>
<text x="88.0" y="237.0" text-anchor="end" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="normal">192–255</text>
<text x="108.0" y="272.0" text-anchor="middle" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="normal">256 keys × 128</text>

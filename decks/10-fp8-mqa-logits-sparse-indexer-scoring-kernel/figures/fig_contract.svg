<svg xmlns="http://www.w3.org/2000/svg" width="484pt" height="338pt" viewBox="0 0 484 338" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- MQA logits kernel contract -->
<rect x="2.0" y="2.0" width="480.0" height="138.0" rx="8" fill="#FFFFFF" stroke="#595959" stroke-width="1.4" stroke-dasharray="5,4" />
<rect x="10.0" y="10.0" width="226.0" height="56.0" rx="6" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="123.0" y="34.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">q · FP8</text>
<text x="123.0" y="56.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">n_q × 64 heads × 128</text>
<rect x="248.0" y="10.0" width="226.0" height="56.0" rx="6" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="361.0" y="34.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">keys · FP8 + scale</text>
<text x="361.0" y="56.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">n_kv × (128 + 4 B)</text>
<rect x="10.0" y="76.0" width="226.0" height="56.0" rx="6" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="123.0" y="100.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">head weights</text>
<text x="123.0" y="122.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">n_q × 64</text>
<rect x="248.0" y="76.0" width="226.0" height="56.0" rx="6" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="361.0" y="100.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">[ks, ke) per query</text>
<text x="361.0" y="122.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">which keys to score</text>
<line x1="242.0" y1="142.0" x2="242.0" y2="165.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="2.0" y="168.0" width="480.0" height="64.0" rx="6" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.6" />
<text x="242.0" y="194.0" text-anchor="middle" font-size="20" fill="#222222" font-weight="bold" font-style="normal">MQA-logits kernel</text>
<text x="242.0" y="220.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal"><tspan>Σ</tspan><tspan baseline-shift="sub" font-size="12.2">h</tspan><tspan> w</tspan><tspan baseline-shift="sub" font-size="12.2">h</tspan><tspan> · ReLU( q</tspan><tspan baseline-shift="sub" font-size="12.2">h</tspan><tspan> · k ) · s</tspan><tspan baseline-shift="sub" font-size="12.2">k</tspan></text>
<line x1="122.0" y1="234.0" x2="122.0" y2="263.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="2.0" y="266.0" width="240.0" height="66.0" rx="6" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.4" />
<text x="122.0" y="295.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">logits</text>
<text x="122.0" y="317.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">n_q × max span</text>
<rect x="278.0" y="266.0" width="204.0" height="66.0" rx="6" fill="#FFFFFF" stroke="#595959" stroke-width="2" stroke-dasharray="6,4" />
<text x="380.0" y="293.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">top-2,048</text>
<text x="380.0" y="315.0" text-anchor="middle" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">separate kernel</text>
<line x1="244.0" y1="299.0" x2="275.0" y2="299.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
</svg>

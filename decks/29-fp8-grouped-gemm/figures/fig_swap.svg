<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="330pt" viewBox="0 0 870 330" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- fig_swap: tokens on the fixed 64-row M side vs on the flexible N side -->
<text x="250.0" y="26.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="normal">(a) tokens as the M side</text>
<rect x="150.0" y="64.0" width="200.0" height="192.0" rx="0" fill="url(#hatchPrb)" stroke="#C00000" stroke-width="2" />
<rect x="150.0" y="64.0" width="200.0" height="24.0" rx="0" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="250.0" y="82.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold" font-style="normal">8 tokens</text>
<text x="250.0" y="176.0" text-anchor="middle" font-size="17" fill="#C00000" font-weight="bold" font-style="normal" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">56 padding rows</text>
<text x="250.0" y="54.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">N = 128 weight cols</text>
<text x="140.0" y="156.0" text-anchor="end" font-size="17" fill="#222222" font-weight="bold" font-style="normal">M = 64</text>
<text x="140.0" y="176.0" text-anchor="end" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">fixed</text>
<text x="650.0" y="26.0" text-anchor="middle" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal">(b) weights as the M side</text>
<rect x="640.0" y="64.0" width="48.0" height="96.0" rx="0" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<rect x="640.0" y="160.0" width="48.0" height="96.0" rx="0" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="664.0" y="54.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">N = 8 tokens</text>
<text x="630.0" y="118.0" text-anchor="end" font-size="16" fill="#222222" font-weight="normal" font-style="normal">WG 1: 64 rows</text>
<text x="630.0" y="214.0" text-anchor="end" font-size="16" fill="#222222" font-weight="normal" font-style="normal">WG 2: 64 rows</text>
<text x="700.0" y="156.0" text-anchor="start" font-size="16" fill="#222222" font-weight="normal" font-style="normal">128 weight</text>
<text x="700.0" y="176.0" text-anchor="start" font-size="16" fill="#222222" font-weight="normal" font-style="normal">rows</text>
<text x="664.0" y="284.0" text-anchor="middle" font-size="15" fill="#1F4E79" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">SM90_64x8x32 FP8 atom</text>
<text x="250.0" y="284.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">y = x · Wᵀ</text>
<text x="650.0" y="308.0" text-anchor="middle" font-size="16" fill="#1F4E79" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">yᵀ = W · xᵀ</text>
<line x1="395.0" y1="160.0" x2="520.0" y2="160.0" stroke="#1F4E79" stroke-width="3" marker-end="url(#arrAcc)"/>
<text x="458.0" y="148.0" text-anchor="middle" font-size="17" fill="#1F4E79" font-weight="bold" font-style="normal">swap</text>
</svg>

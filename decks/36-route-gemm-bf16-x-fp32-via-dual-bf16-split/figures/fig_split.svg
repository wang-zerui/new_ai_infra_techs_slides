<rect x="204.0" y="112.0" width="156.0" height="64.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="282.0" y="139.7" text-anchor="middle" font-size="19" fill="#1F4E79" font-weight="bold" font-style="normal">w_hi</text>
<text x="282.0" y="161.6" text-anchor="middle" font-size="19" fill="#1F4E79" font-weight="bold" font-style="normal">= bf16(w)</text>
<rect x="376.0" y="112.0" width="196.0" height="64.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="474.0" y="139.7" text-anchor="middle" font-size="19" fill="#1F4E79" font-weight="bold" font-style="normal">w_lo</text>
<text x="474.0" y="161.6" text-anchor="middle" font-size="19" fill="#1F4E79" font-weight="bold" font-style="normal">= bf16(256 · r)</text>
<text x="474.0" y="198.0" text-anchor="middle" font-size="17" fill="#7F7F7F" font-weight="normal" font-style="italic">r = w − w_hi;  ×256 is exact</text>
<text x="666.0" y="136.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">tail lost</text>
<text x="666.0" y="166.0" text-anchor="middle" font-size="19" fill="#222222"><tspan >≤ 2</tspan><tspan baseline-shift="super" font-size="13.7">−16</tspan><tspan > · |w|</tspan></text>
<rect x="8.0" y="206.0" width="854.0" height="78.0" rx="6" fill="#FFFFFF" stroke="#595959" stroke-width="1.5" stroke-dasharray="5,3" />
<text x="22.0" y="252.0" text-anchor="start" font-size="18" fill="#7F7F7F" font-weight="bold" font-style="normal">example</text>
<text x="116.0" y="236.0" text-anchor="start" font-size="17" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">w = 0.1234567</text>
<text x="116.0" y="266.0" text-anchor="start" font-size="17" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">w_lo = −0.02014</text>
<text x="350.0" y="236.0" text-anchor="start" font-size="17" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">w_hi = 0.1235352</text>
<text x="350.0" y="266.0" text-anchor="start" font-size="17" fill="#1F4E79" font-weight="bold" font-style="normal" font-family="Menlo, 'Courier New', monospace">w_hi + w_lo/256 = 0.1234565</text>
<text x="660.0" y="236.0" text-anchor="start" font-size="17" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">r = −7.85e−5</text>
<text x="660.0" y="266.0" text-anchor="start" font-size="17" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, 'Courier New', monospace">error = 2.2e−7</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="292pt" viewBox="0 0 870 292" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- fig_bf16 -->
<text x="205.0" y="22.0" text-anchor="middle" font-size="20" fill="#222222" font-weight="bold" font-style="normal">(a) Ring reduce-scatter in BF16</text>
<rect x="70.0" y="60.0" width="150.0" height="38.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="145.0" y="85.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">R0: g0</text>
<line x1="145.0" y1="100.0" x2="145.0" y2="111.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="240.0" y="113.0" text-anchor="start" font-size="17" fill="#C00000" font-weight="bold" font-style="normal">BF16 add + round</text>
<rect x="70.0" y="114.0" width="150.0" height="38.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="145.0" y="139.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">R1: + g1</text>
<line x1="145.0" y1="154.0" x2="145.0" y2="165.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="240.0" y="167.0" text-anchor="start" font-size="17" fill="#C00000" font-weight="bold" font-style="normal">BF16 add + round</text>
<rect x="70.0" y="168.0" width="150.0" height="38.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="145.0" y="193.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">R2: + g2</text>
<line x1="145.0" y1="208.0" x2="145.0" y2="219.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="240.0" y="221.0" text-anchor="start" font-size="17" fill="#C00000" font-weight="bold" font-style="normal">BF16 add + round</text>
<rect x="70.0" y="222.0" width="150.0" height="38.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="145.0" y="247.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">R3: + g3</text>
<text x="205.0" y="282.0" text-anchor="middle" font-size="19" fill="#C00000" font-weight="bold" font-style="normal">rounding error at every hop</text>
<line x1="420.0" y1="10.0" x2="420.0" y2="282.0" stroke="#BFBFBF" stroke-width="1.2"/>
<text x="645.0" y="22.0" text-anchor="middle" font-size="20" fill="#1F4E79" font-weight="bold" font-style="normal">(b) V4: all-to-all, then FP32 sum</text>
<text x="446.0" y="48.0" text-anchor="start" font-size="17" fill="#7F7F7F" font-weight="normal" font-style="normal">BF16 with stochastic rounding</text>
<rect x="446.0" y="60.0" width="148.0" height="38.0" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="2" />
<text x="520.0" y="85.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">R0 gradient</text>
<rect x="446.0" y="114.0" width="148.0" height="38.0" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="2" />
<text x="520.0" y="139.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">R1 gradient</text>
<rect x="446.0" y="168.0" width="148.0" height="38.0" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="2" />
<text x="520.0" y="193.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">R2 gradient</text>
<rect x="446.0" y="222.0" width="148.0" height="38.0" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="2" />
<text x="520.0" y="247.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">R3 gradient</text>
<line x1="596.0" y1="79.0" x2="687.0" y2="130.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#arrAcc)"/>
<line x1="596.0" y1="133.0" x2="687.0" y2="150.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#arrAcc)"/>
<line x1="596.0" y1="187.0" x2="687.0" y2="170.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#arrAcc)"/>
<line x1="596.0" y1="241.0" x2="687.0" y2="190.0" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#arrAcc)"/>
<rect x="690.0" y="112.0" width="170.0" height="96.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.4" />
<text x="775.0" y="156.0" text-anchor="middle" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal">R2 shard</text>
<text x="775.0" y="176.7" text-anchor="middle" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal">Σ in FP32</text>
<text x="775.0" y="234.0" text-anchor="middle" font-size="17" fill="#7F7F7F" font-weight="normal" font-style="normal">same on every rank</text>
<text x="645.0" y="282.0" text-anchor="middle" font-size="19" fill="#1F4E79" font-weight="bold" font-style="normal">one rounding, FP32 accumulation</text>
</svg>

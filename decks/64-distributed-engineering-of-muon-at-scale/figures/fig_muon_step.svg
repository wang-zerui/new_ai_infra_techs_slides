<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="268pt" viewBox="0 0 870 268" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- fig_muon_step -->
<rect x="2.0" y="34.0" width="116.0" height="70.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="60.0" y="65.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">Gradient</text>
<text x="60.0" y="85.7" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">G (n × m)</text>
<line x1="120.0" y1="69.0" x2="143.0" y2="69.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="146.0" y="34.0" width="160.0" height="70.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="226.0" y="65.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">Nesterov</text>
<text x="226.0" y="85.7" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">momentum 0.95</text>
<line x1="308.0" y1="69.0" x2="331.0" y2="69.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="334.0" y="34.0" width="176.0" height="70.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.6" />
<text x="422.0" y="65.0" text-anchor="middle" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal">Newton-Schulz</text>
<text x="422.0" y="85.7" text-anchor="middle" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal">10 iterations</text>
<line x1="512.0" y1="69.0" x2="535.0" y2="69.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="538.0" y="34.0" width="150.0" height="70.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="613.0" y="65.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">Rescale</text>
<text x="613.0" y="85.7" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">RMS to 0.18</text>
<line x1="690.0" y1="69.0" x2="713.0" y2="69.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="716.0" y="34.0" width="152.0" height="70.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="792.0" y="65.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">Decay +</text>
<text x="792.0" y="85.7" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">update W</text>
<text x="2.0" y="20.0" text-anchor="start" font-size="18" fill="#7F7F7F" font-weight="normal" font-style="italic">per logically independent matrix W</text>
<path d="M334,104 L120,140" fill="none" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="5,4"/>
<path d="M510,104 L750,140" fill="none" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="5,4"/>
<rect x="120.0" y="140.0" width="630.0" height="118.0" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.8" stroke-dasharray="6,4" />
<text x="435.0" y="174.0" text-anchor="middle" font-size="23" fill="#222222" font-weight="bold" font-style="normal">X ← aX + b(XXᵀ)X + c(XXᵀ)²X</text>
<text x="435.0" y="204.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="normal" font-style="normal">8 iterations (3.4445, −4.7750, 2.0315) then 2 iterations (2, −1.5, 0.5)</text>
<text x="435.0" y="238.0" text-anchor="middle" font-size="19" fill="#C00000" font-weight="bold" font-style="normal">XXᵀ needs the whole matrix at once</text>
</svg>

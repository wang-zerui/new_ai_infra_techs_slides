<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="306pt"
     viewBox="0 0 870 306" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C00000"/>
    </marker>
    <pattern id="hatchGray" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#F2F2F2"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7F7F7F" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- ============ panel (a) ============ -->
  <text x="10" y="22" font-size="19" font-weight="bold" fill="#222222">(a) Separate kernels</text>
  <text x="80" y="66" text-anchor="end" font-size="17" fill="#595959">GPU</text>

  <rect x="92" y="42" width="118" height="40" fill="url(#hatchGray)" stroke="#595959" stroke-width="1.2"/>
  <text x="151" y="67" text-anchor="middle" font-size="17" fill="#222222">dispatch</text>

  <rect x="210" y="42" width="150" height="40" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="285" y="67" text-anchor="middle" font-size="17" fill="#222222">linear 1</text>

  <rect x="360" y="42" width="78" height="40" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="399" y="67" text-anchor="middle" font-size="17" fill="#222222">SwiGLU</text>

  <rect x="438" y="42" width="150" height="40" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="513" y="67" text-anchor="middle" font-size="17" fill="#222222">linear 2</text>

  <rect x="588" y="42" width="118" height="40" fill="url(#hatchGray)" stroke="#595959" stroke-width="1.2"/>
  <text x="647" y="67" text-anchor="middle" font-size="17" fill="#222222">combine</text>

  <line x1="151" y1="104" x2="151" y2="86" stroke="#C00000" stroke-width="1.6" marker-end="url(#arrRed)"/>
  <line x1="647" y1="104" x2="647" y2="86" stroke="#C00000" stroke-width="1.6" marker-end="url(#arrRed)"/>
  <line x1="151" y1="104" x2="647" y2="104" stroke="#C00000" stroke-width="1.6"/>
  <text x="399" y="124" text-anchor="middle" font-size="18" font-weight="bold" fill="#C00000">tensor cores idle while EP traffic moves</text>

  <!-- ============ panel (b) ============ -->
  <text x="10" y="166" font-size="19" font-weight="bold" fill="#222222">(b) Mega MoE</text>

  <rect x="86" y="178" width="500" height="104" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"
        stroke-dasharray="5,3"/>
  <text x="336" y="198" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F4E79">one kernel launch, symmetric memory</text>

  <text x="80" y="228" text-anchor="end" font-size="17" fill="#595959">NVLink</text>
  <rect x="96" y="206" width="78" height="34" fill="url(#hatchGray)" stroke="#595959" stroke-width="1.2"/>
  <text x="135" y="228" text-anchor="middle" font-size="16" fill="#222222">w1</text>
  <rect x="174" y="206" width="78" height="34" fill="url(#hatchGray)" stroke="#595959" stroke-width="1.2"/>
  <text x="213" y="228" text-anchor="middle" font-size="16" fill="#222222">w2</text>
  <rect x="252" y="206" width="78" height="34" fill="url(#hatchGray)" stroke="#595959" stroke-width="1.2"/>
  <text x="291" y="228" text-anchor="middle" font-size="16" fill="#222222">w3</text>
  <rect x="330" y="206" width="78" height="34" fill="url(#hatchGray)" stroke="#595959" stroke-width="1.2"/>
  <text x="369" y="228" text-anchor="middle" font-size="16" fill="#222222">w4</text>
  <rect x="408" y="206" width="78" height="34" fill="url(#hatchGray)" stroke="#595959" stroke-width="1.2"/>
  <text x="447" y="228" text-anchor="middle" font-size="16" fill="#222222">w5</text>

  <text x="80" y="261" text-anchor="end" font-size="17" fill="#595959">Tensor</text>
  <text x="80" y="279" text-anchor="end" font-size="17" fill="#595959">cores</text>
  <rect x="174" y="248" width="78" height="34" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="213" y="270" text-anchor="middle" font-size="16" fill="#222222">w1</text>
  <rect x="252" y="248" width="78" height="34" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="291" y="270" text-anchor="middle" font-size="16" fill="#222222">w2</text>
  <rect x="330" y="248" width="78" height="34" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="369" y="270" text-anchor="middle" font-size="16" fill="#222222">w3</text>
  <rect x="408" y="248" width="78" height="34" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="447" y="270" text-anchor="middle" font-size="16" fill="#222222">w4</text>
  <rect x="486" y="248" width="78" height="34" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="525" y="270" text-anchor="middle" font-size="16" fill="#222222">w5</text>

  <text x="610" y="222" font-size="17" fill="#222222">w = wave of experts</text>
  <text x="610" y="246" font-size="17" fill="#222222">pull dispatch, GEMM,</text>
  <text x="610" y="268" font-size="17" fill="#222222">SwiGLU, combine fused</text>

  <!-- time axis -->
  <line x1="92" y1="296" x2="790" y2="296" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="800" y="301" font-size="17" fill="#595959">time</text>
</svg>

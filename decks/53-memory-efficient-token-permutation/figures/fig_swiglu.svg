<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="290pt" viewBox="0 0 870 290" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- fused weighted SwiGLU: forward saves z and p; backward rebuilds SwiGLU(z) -->
<text x="8.0" y="34.0" text-anchor="start" font-size="19" fill="#222222" font-weight="bold" font-style="normal">forward</text>
<text x="8.0" y="184.0" text-anchor="start" font-size="19" fill="#222222" font-weight="bold" font-style="normal">backward</text>
<rect x="110.0" y="12.0" width="70.0" height="36.0" rx="9" fill="#F2F2F2" stroke="#595959" stroke-width="1.8" />
<text x="145.0" y="37.0" text-anchor="middle" font-size="20" fill="#222222" font-weight="normal" font-style="normal">z</text>
<rect x="110.0" y="58.0" width="70.0" height="36.0" rx="9" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.2" />
<text x="145.0" y="83.0" text-anchor="middle" font-size="20" fill="#1F4E79" font-weight="bold" font-style="normal">p</text>
<rect x="250.0" y="22.0" width="220.0" height="60.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="360.0" y="58.6" text-anchor="middle" font-size="19" fill="#1F4E79" font-weight="bold" font-style="normal">a = p · SwiGLU(z)</text>
<line x1="182.0" y1="30.0" x2="248.0" y2="42.0" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="182.0" y1="76.0" x2="248.0" y2="64.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#arrAcc)"/>
<rect x="540.0" y="30.0" width="80.0" height="44.0" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="2" />
<text x="580.0" y="58.6" text-anchor="middle" font-size="19" fill="#222222" font-weight="normal" font-style="normal">fc2</text>
<line x1="472.0" y1="52.0" x2="538.0" y2="52.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="700.0" y="46.0" text-anchor="start" font-size="18" fill="#222222" font-weight="normal" font-style="normal">saved: z and p</text>
<text x="700.0" y="70.0" text-anchor="start" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal">no E</text>
<line x1="8.0" y1="116.0" x2="862.0" y2="116.0" stroke="#D9D9D9" stroke-width="1.2"/>
<rect x="110.0" y="150.0" width="70.0" height="36.0" rx="9" fill="#F2F2F2" stroke="#595959" stroke-width="1.8" />
<text x="145.0" y="175.0" text-anchor="middle" font-size="20" fill="#222222" font-weight="normal" font-style="normal">g</text>
<text x="145.0" y="210.0" text-anchor="middle" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">∂L/∂a</text>
<rect x="250.0" y="136.0" width="300.0" height="44.0" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="2" />
<text x="400.0" y="164.3" text-anchor="middle" font-size="18" fill="#222222" font-weight="normal" font-style="normal">∂L/∂z = SwiGLU′(z) · (p g)</text>
<rect x="250.0" y="196.0" width="300.0" height="44.0" rx="4" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2" />
<text x="400.0" y="224.3" text-anchor="middle" font-size="18" fill="#1F4E79" font-weight="bold" font-style="normal">∂L/∂p = Σ  SwiGLU(z) ⊙ g</text>
<line x1="182.0" y1="168.0" x2="248.0" y2="158.0" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="182.0" y1="168.0" x2="248.0" y2="218.0" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
<text x="578.0" y="223.0" text-anchor="start" font-size="17" fill="#1F4E79" font-weight="normal" font-style="italic">SwiGLU(z) recomputed on the fly</text>
<text x="578.0" y="163.0" text-anchor="start" font-size="17" fill="#7F7F7F" font-weight="normal" font-style="italic">one fused kernel</text>
<text x="400.0" y="274.0" text-anchor="middle" font-size="16" fill="#7F7F7F" font-weight="normal" font-style="italic">Σ runs over the row&#x27;s FFN dimension</text>
</svg>

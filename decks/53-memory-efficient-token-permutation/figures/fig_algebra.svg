<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="262pt" viewBox="0 0 870 262" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- move p_i inside W2: scalar multiplication commutes with a bias-free linear map -->
<text x="30.0" y="58.0" text-anchor="start" font-size="20" fill="#7F7F7F" font-weight="normal" font-style="normal">(1)</text>
<text x="110.0" y="58.0" text-anchor="start" font-size="32" fill="#222222" font-family="Times New Roman, Times, serif"><tspan font-style="italic">y</tspan><tspan font-style="normal"> = Σ</tspan><tspan baseline-shift="sub" font-size="21.8" font-style="italic">i</tspan></text>
<text x="206.0" y="58.0" text-anchor="start" font-size="32" fill="#222222" font-family="Times New Roman, Times, serif"><tspan fill="#1F4E79" font-weight="bold" font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="21.8" fill="#1F4E79" font-weight="bold" font-style="italic">i</tspan></text>
<text x="240.0" y="58.0" text-anchor="start" font-size="32" fill="#222222" font-family="Times New Roman, Times, serif"><tspan font-style="italic">· W</tspan><tspan baseline-shift="sub" font-size="21.8" font-style="normal">2</tspan><tspan font-style="italic"> φ(z</tspan><tspan baseline-shift="sub" font-size="21.8" font-style="italic">i</tspan><tspan font-style="italic">)</tspan></text>
<text x="30.0" y="146.0" text-anchor="start" font-size="20" fill="#7F7F7F" font-weight="normal" font-style="normal">(2)</text>
<text x="110.0" y="146.0" text-anchor="start" font-size="32" fill="#222222" font-family="Times New Roman, Times, serif"><tspan font-style="italic">y</tspan><tspan font-style="normal"> = Σ</tspan><tspan baseline-shift="sub" font-size="21.8" font-style="italic">i</tspan><tspan font-style="italic"> W</tspan><tspan baseline-shift="sub" font-size="21.8" font-style="normal">2</tspan><tspan font-style="normal"> (</tspan></text>
<text x="254.0" y="146.0" text-anchor="start" font-size="32" fill="#222222" font-family="Times New Roman, Times, serif"><tspan fill="#1F4E79" font-weight="bold" font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="21.8" fill="#1F4E79" font-weight="bold" font-style="italic">i</tspan></text>
<text x="288.0" y="146.0" text-anchor="start" font-size="32" fill="#222222" font-family="Times New Roman, Times, serif"><tspan font-style="italic">· φ(z</tspan><tspan baseline-shift="sub" font-size="21.8" font-style="italic">i</tspan><tspan font-style="italic">))</tspan></text>
<path d="M218,72 C220,100 252,98 264,114" fill="none" stroke="#1F4E79" stroke-width="2.4" marker-end="url(#arrAcc)"/>
<text x="540.0" y="98.0" text-anchor="start" font-size="19" fill="#7F7F7F" font-weight="normal" font-style="italic">valid when W</text>
<text x="654.0" y="104.0" text-anchor="start" font-size="14" fill="#7F7F7F" font-weight="normal" font-style="italic">2</text>
<text x="666.0" y="98.0" text-anchor="start" font-size="19" fill="#7F7F7F" font-weight="normal" font-style="italic">is linear, no bias</text>
<line x1="30.0" y1="176.0" x2="840.0" y2="176.0" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="110.0" y="228.0" text-anchor="start" font-size="30" fill="#222222" font-family="Times New Roman, Times, serif"><tspan fill="#1F4E79" font-weight="bold" font-style="italic">∂L/∂p</tspan><tspan baseline-shift="sub" font-size="20.4" fill="#1F4E79" font-weight="bold" font-style="italic">i</tspan><tspan font-style="italic"> = ⟨ φ(z</tspan><tspan baseline-shift="sub" font-size="20.4" font-style="italic">i</tspan><tspan font-style="italic">), ∂L/∂a</tspan><tspan baseline-shift="sub" font-size="20.4" font-style="italic">i</tspan><tspan font-style="normal"> ⟩</tspan></text>
<text x="540.0" y="214.0" text-anchor="start" font-size="19" fill="#1F4E79" font-weight="bold" font-style="normal">φ(z) rebuilt from z in the kernel</text>
<text x="540.0" y="240.0" text-anchor="start" font-size="18" fill="#7F7F7F" font-weight="normal" font-style="italic">z is saved for SwiGLU anyway</text>
</svg>

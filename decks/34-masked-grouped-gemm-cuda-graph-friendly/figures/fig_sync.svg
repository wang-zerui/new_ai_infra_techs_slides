<svg xmlns="http://www.w3.org/2000/svg" width="870pt" height="292pt" viewBox="0 0 870 292" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
  <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker>
  <marker id="arrPrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
          markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker>
  <pattern id="hatchPrb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C00000" stroke-width="2.2"/>
  </pattern>
  <pattern id="hatchGray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#A6A6A6" stroke-width="2"/>
  </pattern>
</defs>
<!-- fig_sync: host-shaped grouped GEMM vs worst-case batched GEMM -->
<text x="10.0" y="24.0" text-anchor="start" font-size="19" fill="#222222" font-weight="bold" font-style="normal">(a) GEMM shaped on the host</text>
<text x="56.0" y="86.0" text-anchor="end" font-size="17" fill="#222222" font-weight="bold" font-style="normal">CPU</text>
<text x="56.0" y="168.0" text-anchor="end" font-size="17" fill="#222222" font-weight="bold" font-style="normal">GPU</text>
<rect x="66.0" y="148.0" width="100.0" height="32.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="116.0" y="169.6" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">dispatch</text>
<rect x="166.0" y="148.0" width="196.0" height="32.0" rx="0" fill="url(#hatchPrb)" stroke="#C00000" stroke-width="1.2" />
<text x="264.0" y="169.0" text-anchor="middle" font-size="16" fill="#C00000" font-weight="bold" font-style="normal" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">GPU idle</text>
<rect x="362.0" y="148.0" width="100.0" height="32.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="412.0" y="169.6" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">GEMM</text>
<rect x="176.0" y="66.0" width="112.0" height="32.0" rx="4" fill="#FBE5E5" stroke="#C00000" stroke-width="2" />
<text x="232.0" y="87.6" text-anchor="middle" font-size="16" fill="#C00000" font-weight="bold" font-style="normal">wait counts</text>
<rect x="296.0" y="66.0" width="86.0" height="32.0" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2" />
<text x="339.0" y="87.6" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal" font-style="normal">launch</text>
<line x1="160.0" y1="146.0" x2="196.0" y2="100.0" stroke="#C00000" stroke-width="2" marker-end="url(#arrPrb)"/>
<text x="140.0" y="124.0" text-anchor="end" font-size="15" fill="#C00000" font-weight="bold" font-style="normal">D2H copy</text>
<line x1="372.0" y1="100.0" x2="396.0" y2="146.0" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="66.0" y1="206.0" x2="470.0" y2="206.0" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="466.0" y="224.0" text-anchor="end" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="normal">time</text>
<text x="240.0" y="252.0" text-anchor="middle" font-size="17" fill="#C00000" font-weight="bold" font-style="normal">once per MoE layer</text>
<text x="240.0" y="274.0" text-anchor="middle" font-size="16" fill="#C00000" font-weight="normal" font-style="normal">shape depends on GPU data: no capture</text>
<line x1="488.0" y1="14.0" x2="488.0" y2="286.0" stroke="#999999" stroke-width="1"/>
<text x="508.0" y="24.0" text-anchor="start" font-size="19" fill="#222222" font-weight="bold" font-style="normal">(b) Batched GEMM at worst case</text>
<rect x="534.0" y="46.0" width="80.0" height="96.0" rx="0" fill="#E2F0D9" stroke="#548235" stroke-width="1.6" />
<text x="574.0" y="100.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal">E0</text>
<rect x="534.0" y="142.0" width="80.0" height="74.0" rx="0" fill="url(#hatchPrb)" stroke="#C00000" stroke-width="1.4" />
<rect x="534.0" y="46.0" width="80.0" height="170.0" rx="0" fill="none" stroke="#222222" stroke-width="1.8" />
<rect x="640.0" y="46.0" width="80.0" height="22.0" rx="0" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.6" />
<text x="680.0" y="63.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal">E1</text>
<rect x="640.0" y="68.0" width="80.0" height="148.0" rx="0" fill="url(#hatchPrb)" stroke="#C00000" stroke-width="1.4" />
<rect x="640.0" y="46.0" width="80.0" height="170.0" rx="0" fill="none" stroke="#222222" stroke-width="1.8" />
<rect x="746.0" y="46.0" width="80.0" height="64.0" rx="0" fill="#E4DFEC" stroke="#7030A0" stroke-width="1.6" />
<text x="786.0" y="84.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold" font-style="normal">E2</text>
<rect x="746.0" y="110.0" width="80.0" height="106.0" rx="0" fill="url(#hatchPrb)" stroke="#C00000" stroke-width="1.4" />
<rect x="746.0" y="46.0" width="80.0" height="170.0" rx="0" fill="none" stroke="#222222" stroke-width="1.8" />
<text x="680.0" y="252.0" text-anchor="middle" font-size="17" fill="#C00000" font-weight="bold" font-style="normal">every capacity row computed</text>
<text x="680.0" y="274.0" text-anchor="middle" font-size="16" fill="#C00000" font-weight="normal" font-style="normal">graph-safe but wasteful</text>
</svg>

<text x="482.0" y="144.0" text-anchor="start" font-size="15" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, monospace">  if g == G: break</text>
<text x="854.0" y="144.0" text-anchor="end" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="italic">done</text>
<text x="482.0" y="177.0" text-anchor="start" font-size="15" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, monospace">  acc = A[g][m] @ B[g][n].T</text>
<text x="854.0" y="177.0" text-anchor="end" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="italic">FP8 MMA</text>
<text x="482.0" y="210.0" text-anchor="start" font-size="15" fill="#222222" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, monospace">  D[g][m, n] = bf16(acc)</text>
<text x="854.0" y="210.0" text-anchor="end" font-size="15" fill="#7F7F7F" font-weight="normal" font-style="italic">TMA store</text>
<text x="474.0" y="254.0" text-anchor="start" font-size="15" fill="#222222" font-weight="normal" font-style="normal">locate: group g owns ceil(masked_m[g] / 128) M tiles</text>
